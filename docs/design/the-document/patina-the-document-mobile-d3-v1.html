<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Patina · The Document · D3 Mobile Pattern v1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ow:#FAF7F2;--pe:#E5E2DD;--cl:#C4A57B;--ao:#8B7355;--mo:#5C4A3C;--ch:#2C2926;--sa:#A8B5A0;--db:#8B9CAD;--te:#D4A090;--gh:#E8C547;--paper:#FCFAF6;--sheet2:#EFE9DD;--sheet3:#E2DACA;--body:#5C4A3C;--muted:#8B7355;--ink:rgba(44,41,38,0.18);--fd:'Playfair Display',Georgia,serif;--fb:'Inter',sans-serif;--fm:'DM Mono',monospace;--bar-h:56px}
html,body{height:100%}
body{font-family:var(--fb);background:var(--ch);color:var(--mo);line-height:1.55;-webkit-font-smoothing:antialiased}

/* NO SHADOWS ANYWHERE. Scrim = dimming, not shadow. */

#app{position:fixed;inset:0;background:var(--ch);overflow:hidden}
.frame-note{display:none}
@media(min-width:760px){
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.9rem;background:#1f1d1b}
  #app{position:relative;inset:auto;width:390px;height:800px;border:1px solid rgba(250,247,242,0.18);border-radius:26px}
  .frame-note{display:block;font-family:var(--fm);font-size:0.55rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(250,247,242,0.35)}
}

.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex;animation:pickup .24s ease-out}
.screen.doc.on{animation:raise .26s ease-out}
@keyframes pickup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes raise{from{opacity:0;transform:scale(0.985)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen.on,.screen.doc.on{animation:none}.msheet{transition:none!important}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ===== DESK ===== */
#desk .scroll{padding:1.4rem 1.1rem calc(var(--bar-h) + 2.5rem)}
.desk-date{font-family:var(--fd);font-style:italic;font-weight:400;font-size:1.85rem;color:var(--ow);line-height:1.12}
.desk-find{font-family:var(--fm);font-size:0.5rem;letter-spacing:0.08em;text-transform:uppercase;color:rgba(250,247,242,0.4);border:1px solid rgba(250,247,242,0.12);padding:0.4rem 0.7rem;border-radius:4px;display:inline-block;margin-top:0.7rem}
.desk-sub{display:flex;align-items:center;gap:0.5rem;font-family:var(--fm);font-size:0.48rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(250,247,242,0.35);font-weight:600;margin:1.6rem 0 0.9rem}
.mini-strata{display:inline-flex;flex-direction:column;gap:2px}
.mini-strata i{display:block;height:1.5px;border-radius:1px;background:var(--cl)}
.mini-strata i:nth-child(1){width:13px}.mini-strata i:nth-child(2){width:9px;opacity:0.55}.mini-strata i:nth-child(3){width:6px;opacity:0.3}

.folder{position:relative;margin:16px 4px 1.35rem 0;cursor:pointer}
.folder::before{content:'';position:absolute;left:4px;right:-4px;top:4px;bottom:-4px;background:var(--sheet3);border-radius:4px 7px 7px 7px;border:1px solid var(--ink);z-index:0}
.folder::after{content:'';position:absolute;left:2px;right:-2px;top:2px;bottom:-2px;background:var(--sheet2);border-radius:4px 7px 7px 7px;border:1px solid var(--ink);z-index:0}
.folder-tab{position:absolute;top:-13px;left:14px;padding:3px 12px 2px;background:var(--paper);border:1px solid var(--ink);border-bottom:none;border-radius:5px 5px 0 0;font-family:var(--fm);font-size:0.48rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ao);font-weight:600;z-index:2}
.folder-doc{position:relative;z-index:1;background:var(--paper);border:1px solid var(--ink);border-radius:3px 6px 6px 6px;padding:1rem 1.05rem}
.folder.urgent .folder-doc{outline:1.5px solid rgba(232,197,71,0.55);outline-offset:-1.5px}
.folder-name{font-family:var(--fd);font-weight:500;font-size:1.02rem;color:var(--ch)}
.folder-stage{font-size:0.66rem;color:var(--muted);margin:0.05rem 0 0.55rem}
.folder-need{display:flex;align-items:flex-start;gap:0.5rem;padding-top:0.55rem;border-top:1px solid var(--pe);flex-wrap:wrap}
.folder-need-text{font-size:0.69rem;color:var(--body);line-height:1.5;flex:1;min-width:160px}
.folder-need-text strong{color:var(--ch);font-weight:500}
.motion-chip{display:inline-block;padding:0.42rem 0.7rem;background:rgba(250,247,242,0.05);border:1px solid rgba(250,247,242,0.1);border-radius:4px;font-size:0.64rem;color:rgba(250,247,242,0.6);margin:0 0.3rem 0.3rem 0}
.motion-chip strong{color:rgba(250,247,242,0.85)}

/* ===== STAMPS ===== */
.stamp{display:inline-block;padding:2px 8px;border:1.5px solid;border-radius:3px;font-family:var(--fm);font-size:0.44rem;letter-spacing:0.09em;text-transform:uppercase;font-weight:600;transform:rotate(-1.5deg);white-space:nowrap}
.stamp.signed,.stamp.received,.stamp.paid,.stamp.accepted{color:var(--sa);border-color:var(--sa)}
.stamp.ordered{color:var(--db);border-color:var(--db)}
.stamp.production{color:#b89a2e;border-color:#cfae34}
.stamp.shipped{color:var(--cl);border-color:var(--cl)}
.stamp.draft{color:var(--muted);border-color:#cfc8bb}
.stamp.due{color:#c4836f;border-color:var(--te)}
.stamp.extended{color:var(--db);border-color:var(--db)}

/* ===== DOCUMENT (full-bleed, D12) ===== */
.screen.doc .scroll{background:var(--paper);padding:0 0 calc(var(--bar-h) + 3rem)}
.paper-grain{background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(139,115,85,0.012) 3px,rgba(139,115,85,0.012) 4px)}
.doc-top{padding:0.85rem 1.1rem 0;display:flex;justify-content:space-between;align-items:center}
.backdesk{font-family:var(--fm);font-size:0.46rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);border:1px solid transparent;padding:0.25rem 0.4rem;border-radius:3px}
.backdesk:active{color:var(--cl)}
.presence-line{font-family:var(--fm);font-size:0.42rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--ao)}
.doc-letterhead{padding:0.5rem 1.1rem 1rem;border-bottom:1px solid var(--pe)}
.lh-strata{display:flex;flex-direction:column;gap:3px;margin-bottom:0.5rem}
.lh-strata div{height:1.5px;border-radius:1px}
.lh-strata div:nth-child(1){width:30px;background:var(--cl)}
.lh-strata div:nth-child(2){width:22px;background:var(--cl);opacity:0.55}
.lh-strata div:nth-child(3){width:14px;background:var(--cl);opacity:0.28}
.doc-title{font-family:var(--fd);font-weight:500;font-size:1.35rem;color:var(--ch);line-height:1.15}
.doc-subtitle{font-size:0.64rem;color:var(--muted);margin-top:0.15rem}
.doc-body{padding:0 1.1rem}

.settled-bar{padding:0.65rem 0.85rem;background:rgba(229,226,221,0.32);border:1px solid var(--pe);border-radius:5px;margin:0.9rem 0 0.4rem;display:flex;justify-content:space-between;align-items:center;gap:0.6rem}
.settled-name{font-family:var(--fd);font-weight:500;font-size:0.82rem;color:var(--ao)}
.settled-hint{font-family:var(--fm);font-size:0.42rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);display:block}
.uf-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.uf-body.open{max-height:520px}
.uf-inner{padding:0.8rem 0.9rem;border:1px solid var(--pe);border-top:none;border-radius:0 0 5px 5px;background:rgba(252,250,246,0.7)}
.payrow{display:flex;justify-content:space-between;align-items:center;font-size:0.66rem;color:var(--body);padding:0.2rem 0}

.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:1.1rem 0 0.2rem;gap:0.5rem}
.sec-title{font-family:var(--fd);font-weight:500;font-size:0.98rem;color:var(--ch)}
.sec-meta{font-family:var(--fm);font-size:0.42rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);text-align:right}

.ffe-line{display:flex;justify-content:space-between;gap:0.6rem;padding:0.65rem 0.15rem 0.5rem;border-top:1px solid var(--pe);align-items:flex-start}
.ffe-line.hl{background:rgba(196,165,123,0.08);border-radius:4px}
.ffe-name{font-weight:500;font-size:0.74rem;color:var(--ch);line-height:1.3}
.ffe-vendor{font-size:0.58rem;color:var(--muted);margin-top:1px}
.ffe-right{text-align:right;flex-shrink:0}
.ffe-price{font-family:var(--fd);font-weight:500;font-size:0.74rem;color:var(--ch);margin-top:0.25rem}

/* ===== ANCHORED MARGIN CHIPS (D3) ===== */
.chip-row{display:flex;flex-wrap:wrap;gap:0.35rem;padding:0 0.15rem 0.55rem}
.chip{display:inline-flex;align-items:center;gap:0.4rem;padding:0.32rem 0.6rem 0.32rem 0.5rem;background:var(--paper);border:1px solid var(--pe);border-left-width:2.5px;border-radius:4px;font-size:0.62rem;color:var(--ch);cursor:pointer;max-width:100%}
.chip:active{border-color:#cfc8bb}
.chip .ck{font-family:var(--fm);font-size:0.38rem;letter-spacing:0.07em;text-transform:uppercase;font-weight:600;flex-shrink:0}
.chip .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.decision{border-left-color:var(--gh)}.chip.decision .ck{color:#b89a2e}
.chip.message{border-left-color:var(--db)}.chip.message .ck{color:var(--db)}
.chip.invoice{border-left-color:var(--cl)}.chip.invoice .ck{color:var(--cl)}
.chip.pulse{border-left-color:var(--sa)}.chip.pulse .ck{color:var(--sa)}
.chip.time{border-left-color:var(--mo)}.chip.time .ck{color:var(--mo)}
.chip.resolved{opacity:0.55}

.lead-quote{font-family:var(--fd);font-style:italic;font-size:0.88rem;color:var(--ch);line-height:1.55;padding:0.8rem 0.9rem;background:rgba(196,165,123,0.05);border-left:3px solid var(--cl);border-radius:0 5px 5px 0;margin:0.85rem 0}
.lead-stats{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin:0.85rem 0}
.lead-stat{padding:0.55rem 0.65rem;background:rgba(229,226,221,0.3);border:1px solid var(--pe);border-radius:4px}
.ld-l{font-family:var(--fm);font-size:0.4rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)}
.ld-v{font-size:0.68rem;color:var(--ch);font-weight:500}
.lead-tags{display:flex;flex-wrap:wrap;gap:0.3rem;margin:0.6rem 0}
.lead-tag{padding:0.25rem 0.55rem;background:var(--paper);border:1px solid var(--pe);border-radius:3px;font-size:0.6rem;color:var(--ch)}
.lead-tag.match{background:rgba(196,165,123,0.07);border-color:rgba(196,165,123,0.35);color:var(--ao);font-weight:500}

.mini-btn{display:inline-block;padding:0.45rem 0.85rem;border-radius:4px;font-weight:500;font-size:0.66rem;cursor:pointer;border:1px solid var(--pe);color:var(--ch);background:transparent}
.mini-btn.primary{background:var(--ch);color:var(--ow);border-color:var(--ch)}
.mini-btn.clay{background:var(--cl);color:#fff;border-color:var(--cl)}

/* ===== UNIFIED BOTTOM BAR (D3-1) ===== */
.unibar{position:absolute;left:0;right:0;bottom:0;min-height:var(--bar-h);background:var(--ch);border-top:1px solid rgba(250,247,242,0.16);z-index:40;display:flex;align-items:center;gap:0.5rem;padding:0.45rem 0.8rem calc(0.45rem + env(safe-area-inset-bottom))}
.ub-handle{display:flex;align-items:center;gap:0.5rem;padding:0.42rem 0.7rem;background:rgba(250,247,242,0.06);border:1px solid rgba(250,247,242,0.12);border-radius:5px;cursor:pointer;min-width:0}
.ub-handle:active{border-color:rgba(196,165,123,0.45)}
.ub-strata{display:inline-flex;flex-direction:column;gap:2px;flex-shrink:0}
.ub-strata i{display:block;height:1.5px;border-radius:1px;background:var(--cl)}
.ub-strata i:nth-child(1){width:12px}.ub-strata i:nth-child(2){width:9px;opacity:0.55}.ub-strata i:nth-child(3){width:6px;opacity:0.3}
.ub-label{font-family:var(--fd);font-weight:500;font-size:0.72rem;color:rgba(250,247,242,0.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub-sub{font-family:var(--fm);font-size:0.4rem;letter-spacing:0.08em;text-transform:uppercase;color:rgba(250,247,242,0.4);display:block;line-height:1.2}
.ub-spacer{flex:1}
.ub-timer{font-family:var(--fm);font-size:0.72rem;color:var(--cl);padding:0.42rem 0.6rem;border:1px solid rgba(196,165,123,0.35);border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:0.4rem;flex-shrink:0}
.ub-timer .dot{width:5px;height:5px;border-radius:50%;background:var(--sa)}
.ub-timer .dot.paused{background:rgba(250,247,242,0.25)}
.ub-book{width:34px;height:34px;border:1px solid rgba(250,247,242,0.14);border-radius:5px;display:flex;align-items:center;justify-content:center;gap:2px;cursor:pointer;flex-shrink:0;background:rgba(250,247,242,0.06)}
.ub-book i{display:block;width:2.5px;border-radius:1px;height:14px}
.ub-today{font-family:var(--fd);font-style:italic;font-size:0.72rem;color:var(--cl);white-space:nowrap}
.ub-today-l{font-family:var(--fm);font-size:0.38rem;letter-spacing:0.08em;text-transform:uppercase;color:rgba(250,247,242,0.35);display:block;font-style:normal}
.ub-help{width:26px;height:26px;border:1px solid rgba(250,247,242,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:0.55rem;color:rgba(250,247,242,0.45);flex-shrink:0;cursor:pointer}

/* ===== SHEETS ===== */
.scrim{position:absolute;inset:0;background:rgba(44,41,38,0.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.msheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(104%);transition:transform .28s ease;z-index:60;max-height:80%;overflow-y:auto;border-radius:14px 14px 0 0;padding-bottom:calc(0.9rem + env(safe-area-inset-bottom))}
.msheet.open{transform:none}
.msheet.paper{background:var(--paper);border-top:1px solid var(--ink)}
.msheet.dark{background:var(--ch);border-top:1px solid rgba(250,247,242,0.18)}
.grab{width:36px;height:4px;border-radius:2px;margin:9px auto 4px}
.paper .grab{background:var(--pe)}
.dark .grab{background:rgba(250,247,242,0.2)}
.msheet-in{padding:0.4rem 1.1rem 0.6rem}
.sh-title{font-family:var(--fd);font-weight:500;font-size:1.05rem}
.paper .sh-title{color:var(--ch)}
.dark .sh-title{color:var(--ow)}
.sh-title em{font-style:italic;color:var(--cl)}
.sh-sub{font-size:0.62rem;margin-top:0.1rem}
.paper .sh-sub{color:var(--muted)}
.dark .sh-sub{color:rgba(250,247,242,0.45)}

/* spine sheet */
.sp-put{font-family:var(--fm);font-size:0.5rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ao);padding:0.5rem 0;display:block;cursor:pointer;border-bottom:1px solid var(--pe);margin-bottom:0.4rem}
.sp-item{display:flex;gap:0.6rem;align-items:center;padding:0.5rem 0;cursor:pointer}
.sp-marker{display:flex;flex-direction:column;gap:2px;width:18px;flex-shrink:0}
.sp-marker i{display:block;height:1.5px;border-radius:1px;background:var(--pe)}
.sp-marker i:nth-child(1){width:18px}.sp-marker i:nth-child(2){width:13px}.sp-marker i:nth-child(3){width:8px}
.sp-item.settled .sp-marker i{background:var(--sa);opacity:0.8}
.sp-item.active .sp-marker i{background:var(--cl)}
.sp-item.ghost{opacity:0.45}
.sp-label{font-size:0.74rem;color:var(--muted)}
.sp-item.settled .sp-label{color:var(--ao)}
.sp-item.active .sp-label{color:var(--ch);font-weight:600}
.sp-sub{font-family:var(--fm);font-size:0.4rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);display:block}
.sp-mhead{font-family:var(--fm);font-size:0.46rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ao);font-weight:600;margin:0.9rem 0 0.3rem;padding-top:0.7rem;border-top:1px solid var(--pe)}
.sp-mrow{display:flex;gap:0.55rem;align-items:flex-start;padding:0.45rem 0.55rem;border:1px solid var(--pe);border-left-width:2.5px;border-radius:4px;margin-bottom:0.4rem;cursor:pointer;background:var(--paper)}
.sp-mrow .k{font-family:var(--fm);font-size:0.38rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;flex-shrink:0;margin-top:2px}
.sp-mrow .t{font-size:0.66rem;color:var(--ch);line-height:1.4}
.sp-mrow.resolved{opacity:0.55}

/* margin item sheet */
.mi-kind{font-family:var(--fm);font-size:0.44rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;display:block;margin-bottom:0.2rem}
.mi-title{font-family:var(--fd);font-weight:500;font-size:1rem;color:var(--ch);line-height:1.3}
.mi-desc{font-size:0.68rem;color:var(--muted);margin-top:0.2rem;line-height:1.5}
.mi-anchor{font-family:var(--fm);font-size:0.42rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--ao);margin-top:0.45rem}
.mi-thread{margin-top:0.7rem;padding-top:0.6rem;border-top:1px solid var(--pe)}
.mi-msg{font-size:0.66rem;color:var(--body);line-height:1.55;margin-bottom:0.5rem}
.mi-msg strong{color:var(--ch);font-weight:600}
.mi-input{width:100%;padding:0.55rem 0.6rem;border:1px solid var(--pe);border-radius:5px;font-family:var(--fb);font-size:0.72rem;color:var(--ch);background:#fff;resize:none;margin-top:0.5rem}
.mi-input:focus{outline:none;border-color:var(--cl)}
.mi-actions{display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.7rem}

/* ledger / hours rows (dark sheets) */
.lg-row{display:flex;gap:0.7rem;align-items:center;padding:0.65rem 0;border-bottom:1px solid rgba(250,247,242,0.08);cursor:pointer}
.lg-spine{width:3px;height:18px;border-radius:1px;flex-shrink:0}
.lg-name{font-family:var(--fd);font-weight:500;font-size:0.82rem;color:rgba(250,247,242,0.9)}
.lg-count{font-family:var(--fm);font-size:0.42rem;letter-spacing:0.05em;text-transform:uppercase;color:rgba(250,247,242,0.4);display:block}
.hr-row{display:flex;justify-content:space-between;gap:0.6rem;padding:0.6rem 0;border-bottom:1px solid rgba(250,247,242,0.08);align-items:center}
.hr-name{font-size:0.7rem;color:var(--ow);font-weight:500}
.hr-doc{font-family:var(--fm);font-size:0.4rem;letter-spacing:0.05em;text-transform:uppercase;color:rgba(250,247,242,0.4);display:block}
.hr-time{font-family:var(--fd);font-size:0.78rem;color:var(--ow);border-bottom:1px dashed rgba(250,247,242,0.25);white-space:nowrap}
.hr-add{display:grid;grid-template-columns:1fr 70px;gap:0.4rem;margin-top:0.8rem}
.hr-add select,.hr-add input{padding:0.5rem 0.55rem;border:1px solid rgba(250,247,242,0.18);border-radius:5px;font-size:0.7rem;color:var(--ow);background:rgba(250,247,242,0.05);font-family:var(--fb)}
.hr-add option{background:var(--ch)}

/* timer sheet */
.tm-time{font-family:var(--fm);font-size:1.6rem;color:var(--ch);letter-spacing:0.04em;margin:0.3rem 0 0.6rem}
.tm-form input,.tm-form select{width:100%;padding:0.55rem 0.6rem;border:1px solid var(--pe);border-radius:5px;font-size:0.72rem;color:var(--ch);background:#fff;margin-bottom:0.4rem;font-family:var(--fb)}

/* log strip */
.logstrip{position:absolute;left:0;right:0;bottom:var(--bar-h);background:var(--paper);border-top:1px solid var(--ink);z-index:45;display:none;padding:0.7rem 1rem 0.8rem}
.logstrip.show{display:block;animation:pickup .2s ease-out}
.ls-t{font-size:0.72rem;color:var(--ch)}
.ls-t strong{font-weight:600}
.ls-row{display:flex;gap:0.45rem;align-items:center;margin-top:0.5rem;flex-wrap:wrap}
.ls-min{width:58px;padding:0.4rem;border:1px solid var(--cl);border-radius:5px;font-family:var(--fm);font-size:0.74rem;text-align:center;background:#fff;color:var(--ch)}
.ls-row select{padding:0.4rem 0.45rem;border:1px solid var(--pe);border-radius:5px;font-size:0.66rem;background:#fff;color:var(--ch);font-family:var(--fb)}
.ls-hint{font-size:0.54rem;color:var(--muted);font-style:italic;margin-top:0.4rem}

.toast{position:absolute;bottom:calc(var(--bar-h) + 12px);left:0.8rem;right:0.8rem;background:var(--paper);border:1px solid var(--ink);border-left:3px solid var(--sa);padding:0.65rem 0.85rem;border-radius:6px;font-size:0.66rem;color:var(--ch);z-index:200;display:none}
.toast.show{display:block;animation:pickup .22s ease-out}

/* help overlay */
.overlay{position:absolute;inset:0;background:rgba(44,41,38,0.95);z-index:300;display:none;overflow-y:auto}
.overlay.open{display:block}
.overlay-in{padding:2rem 1.3rem 4rem}
.overlay h2{font-family:var(--fd);font-weight:400;font-size:1.3rem;color:var(--ow);margin-bottom:0.5rem}
.overlay h2 em{font-style:italic;color:var(--cl)}
.overlay p,.overlay li{font-size:0.74rem;color:rgba(250,247,242,0.65);line-height:1.65}
.overlay ul{list-style:none;margin:0.7rem 0}
.overlay li{padding:0.3rem 0;border-bottom:1px solid rgba(250,247,242,0.07)}
.overlay li strong{color:var(--ow);font-weight:500}
.ov-s{font-family:var(--fm);font-size:0.48rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--cl);font-weight:600;margin:1.2rem 0 0.3rem}
.ov-close{font-family:var(--fm);font-size:0.5rem;letter-spacing:0.07em;text-transform:uppercase;color:rgba(250,247,242,0.5);border:1px solid rgba(250,247,242,0.18);padding:0.35rem 0.7rem;border-radius:4px;cursor:pointer;float:right}
</style>
