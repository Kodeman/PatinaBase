<!doctype html>
<meta charset="utf-8">
<title>Onto Cloudflare — Migration Evaluation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Evaluation deck: moving Patina's self-hosted stack onto Cloudflare — scope, work, pricing, and how other clouds compare.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='84'>%E2%98%81%EF%B8%8F</text></svg>">
<style>
  /* ============================================================
     PATINA · Cloudflare migration evaluation
     Sibling to supabase-cloud-migration.html — same "migration
     console" system, re-skinned. Color encodes state:
     CLOUDFLARE AMBER = the target / where compute goes.
     COPPER = the self-hosted box we're leaving.
     PATINA (verdigris) = managed / recommended / zero-rewrite.
     RUST = the landmines.
     ============================================================ */
  :root{
    --ink:#0E1418;          /* deep blue-slate base */
    --ink-2:#141D22;        /* lifted panel */
    --ink-3:#1A252B;        /* raised panel */
    --line:#26333A;         /* hairline */
    --line-2:#324249;
    --fg:#E9E7E0;           /* warm off-white */
    --fg-2:#93A1A8;         /* cool slate text */
    --fg-3:#5E6E75;         /* dim */

    --cf:#F6821F;           /* Cloudflare amber — the target */
    --cf-deep:#B45F12;
    --cf-glow:rgba(246,130,31,.15);
    --patina:#52C0A0;       /* verdigris — recommended / managed */
    --patina-deep:#2C7C66;
    --patina-glow:rgba(82,192,160,.13);
    --copper:#CE9060;       /* aged copper — self-host box / caution */
    --copper-deep:#8A5230;
    --rust:#D6684C;         /* the landmines / danger */
    --rust-deep:#8F3C2A;

    --font-mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

    --pad:clamp(1.25rem,4.5vw,4.5rem);
    --maxw:1120px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--fg);
    font-family:var(--font-sans);
    font-size:clamp(15px,1.05vw,17px);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* faint oxidation bloom: amber where we're going, copper where we've been */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(58vw 58vw at 90% -10%, var(--cf-glow), transparent 60%),
      radial-gradient(46vw 46vw at -6% 108%, rgba(206,144,96,.08), transparent 62%);
  }
  a{color:var(--cf);text-decoration:none}

  /* ---------- console chrome ---------- */
  .statusbar,.footbar{
    position:fixed;left:0;right:0;z-index:30;
    display:flex;align-items:center;gap:1rem;
    padding:.7rem clamp(1rem,3vw,2rem);
    font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;
    color:var(--fg-3);
  }
  .statusbar{top:0;border-bottom:1px solid var(--line);background:rgba(14,20,24,.72);backdrop-filter:blur(8px)}
  .footbar{bottom:0;border-top:1px solid var(--line);background:rgba(14,20,24,.72);backdrop-filter:blur(8px)}
  .dots{display:flex;gap:.4rem}
  .dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--line-2);display:block}
  .dots i:nth-child(1){background:var(--rust-deep)}
  .dots i:nth-child(2){background:var(--copper-deep)}
  .dots i:nth-child(3){background:var(--cf-deep)}
  .sb-eyebrow{color:var(--fg-2);text-transform:uppercase}
  .sb-spacer{flex:1}
  .counter b{color:var(--fg);font-weight:600}
  .rail{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--copper),var(--cf));z-index:40;transition:width .45s var(--ease)}
  @media (prefers-reduced-motion:reduce){.rail{transition:none}}

  .crumb{color:var(--fg-3)}
  .crumb b{color:var(--cf)}
  .navhint{display:flex;gap:1.1rem;align-items:center}
  .btn{
    font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;
    background:transparent;border:1px solid var(--line-2);color:var(--fg-2);
    padding:.35rem .7rem;border-radius:5px;cursor:pointer;transition:.18s var(--ease);
  }
  .btn:hover{border-color:var(--cf);color:var(--cf)}
  .btn:focus-visible{outline:2px solid var(--cf);outline-offset:2px}

  /* ---------- slides ---------- */
  .stage{position:fixed;inset:0;z-index:10}
  .slide{
    position:absolute;inset:0;
    display:grid;place-items:center;
    padding:3.4rem var(--pad);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .5s var(--ease);
  }
  .slide.is-active{opacity:1;visibility:visible;pointer-events:auto}
  .inner{width:100%;max-width:var(--maxw);max-height:100%;overflow:auto;padding:.25rem}
  .inner::-webkit-scrollbar{width:8px}
  .inner::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}

  .slide.is-active .stagger>*{animation:rise .55s var(--ease) both}
  .slide.is-active .stagger>*:nth-child(2){animation-delay:.05s}
  .slide.is-active .stagger>*:nth-child(3){animation-delay:.1s}
  .slide.is-active .stagger>*:nth-child(4){animation-delay:.15s}
  .slide.is-active .stagger>*:nth-child(5){animation-delay:.2s}
  .slide.is-active .stagger>*:nth-child(6){animation-delay:.25s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .slide{transition:none}
    .slide.is-active .stagger>*{animation:none}
  }

  /* ---------- type ---------- */
  .kicker{
    font-family:var(--font-mono);font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--cf);margin-bottom:1.2rem;display:flex;align-items:center;gap:.7rem;
  }
  .kicker.copper{color:var(--copper)} .kicker.rust{color:var(--rust)} .kicker.g{color:var(--patina)}
  .kicker::before{content:"";width:1.8rem;height:1px;background:currentColor;opacity:.7}
  h1{font-family:var(--font-mono);font-weight:600;letter-spacing:-.02em;line-height:1.02;
     font-size:clamp(2.3rem,6.2vw,4.6rem);text-wrap:balance}
  h2{font-family:var(--font-mono);font-weight:600;letter-spacing:-.015em;line-height:1.06;
     font-size:clamp(1.7rem,3.9vw,2.9rem);margin-bottom:1.4rem;text-wrap:balance}
  h2 .accent{color:var(--cf)}
  h2 .go{color:var(--patina)}
  .lede{font-size:clamp(1.05rem,1.7vw,1.35rem);color:var(--fg-2);max-width:62ch;margin-top:1.2rem;line-height:1.55}
  p{color:var(--fg-2);max-width:70ch}
  strong{color:var(--fg);font-weight:600}
  .mono{font-family:var(--font-mono)}
  .tok{font-family:var(--font-mono);font-size:.86em;background:var(--ink-3);border:1px solid var(--line);
       color:var(--fg);padding:.08em .45em;border-radius:4px;white-space:nowrap}
  .tok.o{color:var(--cf);border-color:var(--cf-deep)}
  .tok.g{color:var(--patina);border-color:var(--patina-deep)}
  .tok.c{color:var(--copper);border-color:var(--copper-deep)}
  .tok.r{color:var(--rust);border-color:var(--rust-deep)}

  /* ---------- layout helpers ---------- */
  .cols{display:grid;gap:1.1rem}
  .cols.two{grid-template-columns:1fr 1fr}
  .cols.three{grid-template-columns:repeat(3,1fr)}
  .cols.four{grid-template-columns:repeat(4,1fr)}
  .cols.tight{gap:.7rem}
  .panel{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem}
  .panel.o{border-color:var(--cf-deep);background:linear-gradient(180deg,rgba(246,130,31,.06),transparent)}
  .panel.g{border-color:var(--patina-deep);background:linear-gradient(180deg,rgba(82,192,160,.06),transparent)}
  .panel.c{border-color:var(--copper-deep);background:linear-gradient(180deg,rgba(206,144,96,.06),transparent)}
  .panel.r{border-color:var(--rust-deep);background:linear-gradient(180deg,rgba(214,104,76,.07),transparent)}
  .panel h3{font-family:var(--font-mono);font-size:.95rem;letter-spacing:.02em;margin-bottom:.7rem;color:var(--fg);display:flex;align-items:center;gap:.5rem}
  .panel .cap{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3);margin-bottom:.5rem}

  ul.list{list-style:none;display:flex;flex-direction:column;gap:.55rem}
  ul.list li{position:relative;padding-left:1.4rem;color:var(--fg-2);font-size:.96rem}
  ul.list li::before{content:"›";position:absolute;left:0;top:-.05rem;color:var(--cf);font-family:var(--font-mono)}
  ul.list.copper li::before{content:"–";color:var(--copper)}
  ul.list.check li::before{content:"✓";color:var(--patina);font-size:.85em}
  ul.list.warn li::before{content:"!";color:var(--rust);font-weight:700}
  ul.list li b{color:var(--fg)}

  /* stat grid */
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:.8rem}
  .stat{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:1rem .9rem;text-align:left}
  .stat .n{font-family:var(--font-mono);font-size:clamp(1.5rem,3.2vw,2.3rem);font-weight:600;color:var(--fg);line-height:1;font-variant-numeric:tabular-nums}
  .stat .n.o{color:var(--cf)} .stat .n.g{color:var(--patina)} .stat .n.c{color:var(--copper)} .stat .n.r{color:var(--rust)}
  .stat .l{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-top:.5rem}

  /* tables */
  .tbl{width:100%;border-collapse:collapse;font-size:.9rem}
  .tbl th,.tbl td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
  .tbl th{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
  .tbl td{color:var(--fg-2)}
  .tbl td b{color:var(--fg)}
  .tbl td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr.hi td{background:rgba(82,192,160,.06)}
  .scroll-x{overflow-x:auto}

  .tag{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;
       padding:.18em .5em;border-radius:999px;border:1px solid;white-space:nowrap;display:inline-block}
  .tag.o{color:var(--cf);border-color:var(--cf-deep);background:rgba(246,130,31,.08)}
  .tag.g{color:var(--patina);border-color:var(--patina-deep);background:rgba(82,192,160,.08)}
  .tag.c{color:var(--copper);border-color:var(--copper-deep);background:rgba(206,144,96,.08)}
  .tag.r{color:var(--rust);border-color:var(--rust-deep);background:rgba(214,104,76,.09)}
  .tag.n{color:var(--fg-2);border-color:var(--line-2)}

  /* decision / rec rows */
  .rec{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:start;padding:.9rem 0;border-bottom:1px solid var(--line)}
  .rec:last-child{border-bottom:none}
  .rec .badge{font-family:var(--font-mono);font-weight:700;color:var(--ink);background:var(--cf);
    width:2rem;height:2rem;border-radius:6px;display:grid;place-items:center;font-size:.9rem}
  .rec .badge.g{background:var(--patina)}
  .rec h4{font-family:var(--font-mono);font-size:.98rem;color:var(--fg);margin-bottom:.35rem}
  .rec .pick{color:var(--fg-2);font-size:.92rem}
  .rec .pick b{color:var(--fg)}
  .rec .alt{color:var(--fg-3);font-size:.82rem;margin-top:.25rem;font-family:var(--font-mono)}

  /* boot readout */
  .boot{font-family:var(--font-mono);font-size:clamp(.8rem,1.4vw,1rem);line-height:1.9;color:var(--fg-2);
        margin-top:2rem;border-left:2px solid var(--line-2);padding-left:1.1rem;max-width:70ch}
  .boot .p{color:var(--fg-3)}
  .boot .l1{color:var(--copper)} .boot .l2{color:var(--cf)} .boot .l3{color:var(--fg)}
  .cur{display:inline-block;width:.6em;height:1.05em;background:var(--cf);vertical-align:-.15em;margin-left:.15em;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.cur{animation:none}}

  /* product-map rows: current → cloudflare */
  .map{display:flex;flex-direction:column;gap:.5rem}
  .maprow{display:grid;grid-template-columns:1fr auto 1fr auto;gap:.8rem;align-items:center;
    background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;font-size:.9rem}
  .maprow .from{color:var(--fg-2)} .maprow .from b{color:var(--copper)}
  .maprow .to{color:var(--fg)} .maprow .to b{color:var(--cf)}
  .maprow.gap{border-color:var(--rust-deep);background:linear-gradient(180deg,rgba(214,104,76,.07),transparent)}
  .maprow.gap .to b{color:var(--rust)}
  .maprow .ar{font-family:var(--font-mono);color:var(--fg-3)}

  /* layered architecture tiers */
  .tiers{display:flex;flex-direction:column;gap:.55rem;margin-top:.4rem}
  .tier{border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem;background:var(--ink-2)}
  .tier .tl{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);margin-bottom:.4rem}
  .tier .items{display:flex;flex-wrap:wrap;gap:.4rem}
  .tier.cf{border-color:var(--cf-deep);background:linear-gradient(180deg,rgba(246,130,31,.06),transparent)}
  .tier.cf .tl{color:var(--cf)}
  .tier.data{border-color:var(--patina-deep);background:linear-gradient(180deg,rgba(82,192,160,.06),transparent)}
  .tier.data .tl{color:var(--patina)}
  .tierlink{font-family:var(--font-mono);font-size:.78rem;color:var(--cf);text-align:center;letter-spacing:.04em}
  .chip{font-family:var(--font-mono);font-size:.74rem;padding:.24em .6em;border-radius:6px;border:1px solid var(--line-2);color:var(--fg-2);background:var(--ink-3)}
  .chip.o{color:var(--cf);border-color:var(--cf-deep)}
  .chip.g{color:var(--patina);border-color:var(--patina-deep)}

  /* timeline */
  .phases{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem}
  .phase{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:.9rem;position:relative}
  .phase .ph-n{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.14em;color:var(--cf);text-transform:uppercase}
  .phase h4{font-family:var(--font-mono);font-size:.94rem;color:var(--fg);margin:.4rem 0 .5rem}
  .phase p{font-size:.8rem;color:var(--fg-2)}
  .phase .gate{margin-top:.6rem;font-family:var(--font-mono);font-size:.68rem;color:var(--copper);border-top:1px dashed var(--line-2);padding-top:.45rem}

  /* overview grid */
  .overview{position:fixed;inset:0;z-index:60;background:rgba(9,13,16,.96);backdrop-filter:blur(6px);
    padding:clamp(1.2rem,4vw,3rem);overflow:auto;display:none}
  .overview.open{display:block}
  .overview h2{margin-bottom:1.4rem}
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem}
  .ov-cell{text-align:left;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;
    padding:.8rem;cursor:pointer;transition:.15s var(--ease);color:var(--fg-2);font-family:inherit}
  .ov-cell:hover{border-color:var(--cf);transform:translateY(-2px)}
  .ov-cell:focus-visible{outline:2px solid var(--cf);outline-offset:2px}
  .ov-cell .num{font-family:var(--font-mono);font-size:.66rem;color:var(--fg-3)}
  .ov-cell .t{display:block;margin-top:.3rem;color:var(--fg);font-size:.9rem;font-family:var(--font-mono)}
  .ov-cell.here{border-color:var(--cf);background:rgba(246,130,31,.08)}

  .hero-badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.6rem}

  .hint{position:fixed;bottom:3.6rem;left:50%;transform:translateX(-50%);z-index:25;
    font-family:var(--font-mono);font-size:.72rem;color:var(--fg-3);letter-spacing:.06em;
    background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:.4rem 1rem;
    transition:opacity .6s var(--ease)}
  .hint.gone{opacity:0;pointer-events:none}

  .note{font-family:var(--font-mono);font-size:.76rem;color:var(--fg-3);margin-top:1rem}
  .note b{color:var(--copper)}
  .src{font-family:var(--font-mono);font-size:.7rem;color:var(--fg-3);margin-top:.4rem}

  /* ---------- responsive ---------- */
  @media (max-width:860px){
    .cols.two,.cols.three,.cols.four{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .phases{grid-template-columns:1fr 1fr}
    .maprow{grid-template-columns:1fr auto 1fr;grid-template-areas:"from ar to";row-gap:.4rem}
    .maprow .tag{grid-column:1 / -1;justify-self:start}
    .sb-eyebrow{display:none}
    .navhint .btn.wide{display:none}
  }
  @media (max-width:520px){
    .stats{grid-template-columns:1fr 1fr}
    .phases{grid-template-columns:1fr}
    .maprow{grid-template-columns:1fr;grid-template-areas:none}
    .maprow .ar{display:none}
    .crumb{display:none}
  }

  /* ---------- print ---------- */
  @media print{
    body{overflow:visible;background:#fff;color:#111}
    body::before,.statusbar,.footbar,.rail,.overview,.hint{display:none!important}
    .stage{position:static}
    .slide{position:static;opacity:1;visibility:visible;page-break-after:always;min-height:auto;padding:2rem;display:block}
    .inner{max-height:none;overflow:visible;max-width:none}
    h1,h2,.kicker{color:#111}
  }
</style>

<div class="rail" id="rail"></div>

<header class="statusbar">
  <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
  <span class="sb-eyebrow" id="sbSection">patina · infra</span>
  <span class="sb-spacer"></span>
  <span class="counter">slide <b id="sbNow">1</b> / <span id="sbTotal">20</span></span>
</header>

<main class="stage" id="stage" aria-live="polite"></main>

<div class="hint" id="hint">← → navigate · <span style="color:var(--fg-2)">O</span> overview · <span style="color:var(--fg-2)">?</span> keys</div>

<footer class="footbar">
  <span class="crumb">~/patina/cloudflare › <b id="crumb">01_title</b></span>
  <span class="sb-spacer"></span>
  <span class="navhint">
    <button class="btn" id="prev" aria-label="Previous slide">← prev</button>
    <button class="btn wide" id="ovBtn" aria-label="Open overview">▦ overview</button>
    <button class="btn" id="next" aria-label="Next slide">next →</button>
  </span>
</footer>

<section class="overview" id="overview" aria-label="Slide overview">
  <h2>Overview <span class="accent">·</span> jump to any slide</h2>
  <div class="ov-grid" id="ovGrid"></div>
</section>

<script>
/* ================= SLIDE CONTENT =================
   Each slide: {sec, crumb, html}. Rendered into .stage. */
const S = [];
const push = (sec, crumb, html) => S.push({sec, crumb, html});

/* 01 — TITLE */
push("infra","01_title",`
<div class="inner stagger">
  <div class="kicker">infrastructure evaluation · july 2026</div>
  <h1>Onto Cloudflare.</h1>
  <p class="lede">Moving Patina off a single self-hosted box and onto Cloudflare's managed cloud — the portals, the edge functions, the services, and the object store. Everything except the one thing Cloudflare can't host.</p>
  <div class="boot">
    <div><span class="p">$</span> <span class="l1">infra --current</span></div>
    <div class="p">self-hosted · one Proxmox box · Coolify · 11-container Supabase + 4 services + 4 portals · Cloudflare Tunnel</div>
    <div><span class="p">$</span> <span class="l2">infra --target</span></div>
    <div class="p">Cloudflare Workers · Containers · R2 · Access · Hyperdrive → managed Postgres behind it</div>
    <div><span class="p">$</span> <span class="l3">verdict</span></div>
    <div class="l3">move the compute — <strong style="color:var(--cf)">keep Postgres managed</strong>. ≈ $150–$350/mo, medium effort<span class="cur"></span></div>
  </div>
</div>`);

/* 02 — EXECUTIVE SUMMARY */
push("summary","02_the-answer",`
<div class="inner stagger">
  <div class="kicker">the one-slide answer</div>
  <h2>Cloudflare can host <span class="accent">everything but the database</span>.</h2>
  <p class="lede" style="margin-top:0">So the move is a <strong>hybrid</strong>, not a lift-and-shift: put every stateless piece on Cloudflare, and keep Patina's Postgres on a managed provider behind Hyperdrive. The single fact that decides this is <strong>Postgres coupling</strong> — nothing else is close.</p>
  <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:1.3rem">
    <div class="stat"><div class="n o">HYBRID</div><div class="l">recommended shape</div></div>
    <div class="stat"><div class="n g">0</div><div class="l">rewrites of RLS / auth / functions</div></div>
    <div class="stat"><div class="n r">D1 ✗</div><div class="l">Cloudflare has no Postgres</div></div>

const stage = document.getElementById('stage');
const rail = document.getElementById('rail');
const sbNow = document.getElementById('sbNow');
const sbTotal = document.getElementById('sbTotal');
const sbSection = document.getElementById('sbSection');
const crumb = document.getElementById('crumb');
const overview = document.getElementById('overview');
const ovGrid = document.getElementById('ovGrid');
const hint = document.getElementById('hint');

sbTotal.textContent = S.length;

S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className='slide';
  el.id='s'+i;
  el.setAttribute('aria-hidden','true');
  el.innerHTML = s.html;
  stage.appendChild(el);
  const title = s.crumb.replace(/^\d+_/,'').replace(/-/g,' ');
  const cell = document.createElement('button');
  cell.className='ov-cell';
  cell.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span><span class="t">${title}</span>`;
  cell.addEventListener('click',()=>{go(i);closeOverview();});
  ovGrid.appendChild(cell);
});
const slides=[...document.querySelectorAll('.slide')];
const ovCells=[...ovGrid.children];

let cur=-1;
function go(n){
  n=Math.max(0,Math.min(S.length-1,n));
  if(n===cur) return;
  if(cur>=0){slides[cur].classList.remove('is-active');slides[cur].setAttribute('aria-hidden','true');}
  cur=n;
  const sl=slides[cur];
  sl.classList.add('is-active');sl.setAttribute('aria-hidden','false');
  sl.querySelector('.inner')?.scrollTo(0,0);
  sbNow.textContent=cur+1;
  sbSection.textContent='patina · '+S[cur].sec;
  crumb.textContent=S[cur].crumb;
  rail.style.width=((cur+1)/S.length*100)+'%';
  ovCells.forEach((c,i)=>c.classList.toggle('here',i===cur));
  history.replaceState(null,'','#'+(cur+1));
}
function next(){go(cur+1);} function prev(){go(cur-1);}
function openOverview(){overview.classList.add('open');}
function closeOverview(){overview.classList.remove('open');}
function toggleOverview(){overview.classList.toggle('open');}

document.getElementById('next').addEventListener('click',next);
document.getElementById('prev').addEventListener('click',prev);
document.getElementById('ovBtn').addEventListener('click',toggleOverview);
overview.addEventListener('click',e=>{if(e.target===overview)closeOverview();});

let hintTimer=setTimeout(()=>hint.classList.add('gone'),4200);
function killHint(){hint.classList.add('gone');clearTimeout(hintTimer);}

addEventListener('keydown',e=>{
  if(overview.classList.contains('open')){
    if(e.key==='Escape'||e.key==='o'||e.key==='O'){closeOverview();e.preventDefault();}
    return;
  }
  switch(e.key){
    case 'ArrowRight':case 'PageDown':case ' ':case 'Spacebar':
      next();killHint();e.preventDefault();break;
    case 'ArrowLeft':case 'PageUp':
      prev();killHint();e.preventDefault();break;
    case 'Home':go(0);e.preventDefault();break;
    case 'End':go(S.length-1);e.preventDefault();break;
    case 'o':case 'O':openOverview();killHint();e.preventDefault();break;
    case '?':openOverview();killHint();e.preventDefault();break;
    case 'Escape':closeOverview();break;
  }
});

let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();killHint();}
},{passive:true});

const start=parseInt((location.hash||'').replace('#',''),10);
go(Number.isFinite(start)&&start>=1?start-1:0);
</script>
