# =============================================================================
# Patina ghcr-apps stack — snapshot of the live Coolify-managed compose
# =============================================================================
#
# This file mirrors `/data/coolify/services/oc8kggksw4s8sg08o4w0wsw4/docker-compose.yml`
# on the production server (192.168.1.14). Coolify is the source of truth — it
# generates the live file from its UI/database, and this snapshot exists only so
# that two latent fixes survive a Coolify regenerate:
#
#   1. The `es8w8g0c00og4gsgg0k8w8o8` (Supabase stack) external network is
#      attached to orders/media/projects so they can reach
#      `db-es8w8g0c00og4gsgg0k8w8o8:5432` and `patina-redis`. Without this,
#      services boot, log "Mapped routes...", and crash on the first DB query
#      with `Can't reach database server` and `getaddrinfo EAI_AGAIN
#      patina-redis`. Coolify's UI does not expose this network attachment.
#
#   2. NestJS service healthchecks probe `/v1/health` (matching the global
#      `/v1` API prefix), not the bare `/health` Coolify generates by default.
#      Without this, containers run forever marked `(unhealthy)` even when
#      working.
#
# If Coolify regenerates the on-server file (e.g. after a stack rename or
# UI re-import), copy this file back into place:
#
#   scp infra/coolify/docker-compose.ghcr-apps.yml \
#       kody@192.168.1.14:/tmp/ghcr-apps-compose.yml
#   ssh kody@192.168.1.14 'sudo cp /tmp/ghcr-apps-compose.yml \
#       /data/coolify/services/oc8kggksw4s8sg08o4w0wsw4/docker-compose.yml \
#     && cd /data/coolify/services/oc8kggksw4s8sg08o4w0wsw4 \
#     && sudo docker compose up -d --force-recreate'
#
# Stack identity:
#   Coolify project: Strata (l4g8cswgosw8s80ck84so880)
#   Stack UUID:      oc8kggksw4s8sg08o4w0wsw4 (patina-ghcr-apps)
#   Snapshot taken:  2026-05-03 (post-rebuild deploy)
#
# All credentials reference ${VAR} substitution from
# `/data/coolify/services/oc8kggksw4s8sg08o4w0wsw4/.env` — never paste secrets
# into this file.
# =============================================================================
