[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patina-scan-modal"
version = "0.1.0"
description = "Patina Rendered Room v2 Modal pipeline (verify on CPU, splat on L4, renders on L40S)."
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Patina" }]

# ── Runtime dependencies ────────────────────────────────────────────────────
# The pure geometry core (scan_modal.core) needs numpy and nothing else, so a
# unit-test run never pulls Modal, Open3D, boto3 or psycopg. Everything a
# specific SEAM imports is an OPTIONAL EXTRA below, SEAM-NAMED, exactly as
# services/scan-pipeline does — the Modal image installs the union, a laptop
# installs the slice it actually exercises.
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
# verify's plane segmentation. Open3D is PREFERRED (mac/linux wheels exist) but
# never required: core/verify.py carries a numpy RANSAC fallback so the stage is
# testable on any interpreter Open3D has not shipped a wheel for yet.
verify = ["open3d>=0.18"]
# The IO seam: presigned-URL downloads (httpx), R2 (boto3), direct Postgres
# against the scan_worker role (psycopg v3).
io = ["httpx>=0.24,<1.0", "boto3>=1.34", "psycopg[binary]>=3.1"]
# The Modal client itself — only `modal deploy` and the Modal container need it.
# scan_modal.app imports it defensively so the module stays importable without.
modal = ["modal>=1.0"]

# ── splat (Modal L4) ────────────────────────────────────────────────────────
# Pins researched 2026-08; the image that installs them is `_SPLAT_IMAGE` in
# scan_modal/app.py, on a CUDA *devel* base because gsplat builds CUDA kernels.
#
#   nerfstudio 1.1.5  — latest on PyPI (2024-11-11). `splatfacto` is the method;
#                       it reads a COLMAP-free `transforms.json`, which is
#                       exactly what core/transforms.py writes, and exports via
#                       `ns-export gaussian-splat`.
#   gsplat 1.5.3      — latest on PyPI (2025-07-04); splatfacto's rasterizer.
#                       Pinned rather than floated: it compiles CUDA kernels, so
#                       a float here is a rebuild-and-pray on every deploy.
#   torch 2.5.1 / torchvision 0.20.1 from the cu124 index — matches the CUDA
#                       12.4 base. nerfstudio does not pin torch itself, so
#                       leaving it unpinned resolves a CPU-only wheel about as
#                       often as not.
#   pillow-heif       — the captured photos are HEIC and PIL cannot open them
#                       without this opener registered.
#
# SPZ: the PyPI `spz` wheel is a Rust binding whose documented surface is
# load-an-.spz / build-from-numpy — there is no published PLY→SPZ entry point as
# of 2026-08. The converter is therefore the `spz-cli` Rust binary (installed
# via rustup in the image), driven through core/spz.py's `SPZ_COMMAND` argv
# TEMPLATE so the exact spelling is an environment value, not a code change.
splat = ["pillow-heif>=0.18", "spz>=0.0.1"]

# ── renders (Modal L40S) ────────────────────────────────────────────────────
# Modal's own published Blender pattern: the `bpy` wheel rather than a Blender
# install, plus `xorg`/`libxkbcommon0` in the image. bpy 4.5.0 is the version
# that pattern names; 4.5.x is the LTS line (4.5.12 exists as of 2026-07) and is
# built against CPython 3.11 — which is why app.PYTHON_VERSION is 3.11.
# Nothing in scan_modal imports bpy: core/blender_ops.py is the only file that
# touches it, always inside a method, so the test environment never needs it.
renders = ["bpy==4.5.0"]

dev = [
  "pytest>=7.4",
  "patina-scan-modal[io,verify]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
