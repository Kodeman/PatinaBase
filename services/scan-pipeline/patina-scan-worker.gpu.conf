# /etc/systemd/system/patina-scan-worker.service.d/gpu.conf
# GPU drop-in overlay for the scan-pipeline worker (design §5.1, §10.2/§10.3/§10.5).
#
# This is a systemd DROP-IN, not a separate unit: it layers the GPU-only changes
# ON TOP of patina-scan-worker.service so there is exactly one base unit to reason
# about. `install.sh --gpu` copies it into
#   /etc/systemd/system/patina-scan-worker.service.d/gpu.conf
# and a plain `install.sh` never lays it down (a CPU worker gets no GPU policy).
# Unit dependencies, Environment=, and DeviceAllow= all MERGE ADDITIVELY over
# the base unit's values — this file only ADDS.
[Unit]
# Cold boots may not have created the NVIDIA compute/UVM nodes when the worker
# is scheduled. The root oneshot loads them before this unprivileged service;
# install.sh --gpu is the only path that installs the oneshot and this drop-in.
Requires=patina-scan-worker-nvidia-prepare.service
After=patina-scan-worker-nvidia-prepare.service

[Service]
# ── GPU device access ───────────────────────────────────────────────────────
# The base unit sets ProtectSystem=strict but NO device policy, so /dev is fully
# visible. Naming any DeviceAllow flips systemd's DevicePolicy to "closed": the
# service then sees ONLY the base pseudo-devices (/dev/null, /dev/zero, …) PLUS
# what is listed here — i.e. the NVIDIA nodes and nothing else. systemd DOES NOT
# expand globs in device-node paths, so enumerate the accepted box's one 2080 Ti
# compute node and the control/UVM nodes CUDA compute actually needs. Modeset and
# UVM-tools are not granted: they are optional for this headless compute service.
# A future multi-GPU box must add one exact /dev/nvidiaN line per card and verify
# it with the CUDA doctor probe.
DeviceAllow=/dev/nvidia0 rw
DeviceAllow=/dev/nvidiactl rw
DeviceAllow=/dev/nvidia-uvm rw
# PrivateDevices=true would hand the service a private /dev with only pseudo-
# devices — the nvidia nodes would vanish. GPU work requires it OFF. The base
# unit does not set it (default off); assert it so a future base change can't
# silently blind the GPU.
PrivateDevices=false

# ── torch / CUDA cache confinement ──────────────────────────────────────────
# ProtectSystem=strict + ProtectHome=true make an unconfined cache EACCES. The
# base unit already confines XDG_CACHE_HOME under APP_DIR; torch's hub cache
# defaults under it, but pin it explicitly; redirect nvidia's JIT/PTX cache
# (CUDA_CACHE_PATH — a NON-XDG ~/.nv default); and redirect torch C++/CUDA JIT
# extensions (TORCH_EXTENSIONS_DIR defaults under the platform temp dir).
# All three dirs sit under APP_DIR/.cache, which the base unit already lists in
# ReadWritePaths, so no new write path is required — install.sh --gpu creates
# them owned by the service user, and `doctor` probes each.
Environment=TORCH_HOME=/opt/patina/scan-pipeline/.cache/torch
Environment=CUDA_CACHE_PATH=/opt/patina/scan-pipeline/.cache/nv
Environment=TORCH_EXTENSIONS_DIR=/opt/patina/scan-pipeline/.cache/torch_extensions
