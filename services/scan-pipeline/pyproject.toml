[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patina-scan-worker"
version = "0.1.0"
description = "Patina Field Capture scan-pipeline reconstruction worker (ingest → solve → drawings)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Patina" }]

# ── Runtime dependencies ────────────────────────────────────────────────────
# The core worker (ingest + the P1 solve, which is pure-Python) needs only an
# HTTP client (PostgREST RPCs + Storage REST), exactly as services/aesthete-
# inference does. Everything a specific STAGE imports is an OPTIONAL EXTRA below,
# STAGE-NAMED, so a CPU-only worker never pulls CUDA and each box installs only
# what its STAGES claim.
dependencies = [
  "httpx>=0.24,<1.0",
]

[project.optional-dependencies]
# ── P1 stages (shipped) ─────────────────────────────────────────────────────
# `solve` was declared for the least-squares fit; P1 solve is pure-Python so it
# stays unused today (kept as shipped). `drawings` = the item-11 SVG/PDF/DXF path.
solve = ["numpy>=1.26", "scipy>=1.11"]
# ifcopenshell 0.8.5: current 0.8.x, real wheels for linux (manylinux_2_31
# x86_64/aarch64) and macOS arm64, py311-py314 — no source build needed on any
# box this worker targets. Pulls its own numpy; pinned explicitly too since
# drawing/ifc.py imports numpy directly for placement matrices.
drawings = ["ezdxf>=1.1", "cairosvg>=2.7", "ifcopenshell==0.8.5", "numpy>=1.26"]

# ── P2 GPU stages (item 3) — each pulls ONLY what its stage imports ──────────
# refine (§10.2 / I87): target COLMAP 4.0.2 known-pose triangulation + BA;
#   position-prior mapper fallback. The CLI and binding MUST both report 4.0.2
#   in the still-owed box fixture; the exact binding pin prevents a silent DB/
#   model API mismatch. This is a target, not a completed runtime qualification.
#   COLMAP is a system binary (box prep, not pip); pycolmap reads/writes its DB
#   and models. No standalone GLOMAP package and no torch.
refine = ["pycolmap==4.0.2", "numpy>=1.26", "scipy>=1.11"]
# fuse (§10.3): TSDF dense mesh (Open3D) + decimation + glb export. No torch.
fuse = ["open3d>=0.18", "trimesh>=4.0", "numpy>=1.26"]
# splat (§10.5): the ONLY CUDA/torch stage — 3DGS training (gsplat) → SPZ.
#   TURING PIN REALITY (SM 7.5, 2080 Ti): sm_75 is served by PyTorch's cu118
#   (CUDA 11.8) wheels — it is NOT dropped from modern torch (the cu118 arch list
#   still spans sm_37..sm_90). The binding constraint is the BOX's CUDA-11.x-era
#   driver, which needs the cu118 RUNTIME. So the box installs the +cu118 wheel
#   via the PyTorch index (README box-prep: `--extra-index-url
#   https://download.pytorch.org/whl/cu118`); gsplat may JIT-compile CUDA kernels
#   on first rasterization and needs the matching CUDA 11.8 toolkit (nvcc). The
#   torch band below
#   is the conservative Turing+gsplat-tested ceiling; `doctor`'s torch.cuda check
#   on the box is the ground truth. (SPZ writer dep lands with item 7.)
splat = ["torch>=2.2,<2.5", "gsplat>=1.0,<2.0", "numpy>=1.26"]
# gpu meta-extra — the box's one-line install of all three GPU stages.
gpu = ["patina-scan-worker[refine,fuse,splat]"]

# ── storage cutover (W3-C, storage_backend.py) ──────────────────────────────
# R2StorageBackend needs boto3 only when SCAN_STORAGE_BACKEND=r2 or
# SCAN_STORAGE_SHADOW=r2 (config.py); a Supabase-only worker never installs
# it — imports stay lazy (inside functions) so this extra is opt-in, not a
# hard dependency of storage_backend.py itself.
r2 = ["boto3>=1.34"]

dev = [
  "pytest>=7.4",
  "build>=1.2,<2",
  "setuptools>=68",
  "wheel>=0.41",
  "numpy>=1.26",
]

[project.scripts]
patina-scan-worker = "patina_scan_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the byte-identical validator plus the reviewed libheif helper source used
# by both the standalone physical gate and the installer-built disabled runtime
# adapter. Compiled helpers are release-local artifacts, never wheel members.
patina_scan_worker = ["stages/validator.py", "field_raster_libheif.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
