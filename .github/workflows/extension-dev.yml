name: Extension — Development ZIP

on:
  push:
    tags:
      - "extension-dev-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/extension-dev-v}"
          PACKAGE_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and package extension
        env:
          PLASMO_PUBLIC_SUPABASE_URL: ${{ secrets.EXT_SUPABASE_URL }}
          PLASMO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXT_SUPABASE_ANON_KEY }}
          PLASMO_PUBLIC_PORTAL_URL: ${{ secrets.EXT_PORTAL_URL }}
          PLASMO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXT_POSTHOG_KEY }}
          PLASMO_PUBLIC_UPDATE_URL: https://bkvcixdmuyejfzcijpdg.supabase.co/storage/v1/object/public/extension-releases/version.json
        run: |
          pnpm --filter @patina/extension type-check
          pnpm --filter @patina/extension test
          pnpm --filter @patina/extension build
          pnpm --filter @patina/extension package

      - name: Prepare release artifacts
        id: artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="$(find apps/extension/build -name '*.zip' | head -1)"
          if [ -z "$ZIP" ]; then
            echo "No packaged extension ZIP was produced" >&2
            exit 1
          fi

          VERSIONED="apps/extension/build/patina-capture-${VERSION}.zip"
          LATEST="apps/extension/build/patina-capture-beta-latest.zip"
          cp "$ZIP" "$VERSIONED"
          cp "$ZIP" "$LATEST"
          echo "versioned=$VERSIONED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          node -e "const fs=require('fs');fs.writeFileSync('apps/extension/build/version.json',JSON.stringify({version:process.argv[1],downloadUrl:'https://bkvcixdmuyejfzcijpdg.supabase.co/storage/v1/object/public/extension-releases/patina-capture-'+process.argv[1]+'.zip',changelog:'',releasedAt:new Date().toISOString()},null,2)+'\n')" "$VERSION"

      - name: Upload development artifacts to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.EXT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          upload() {
            local source="$1"
            local destination="$2"
            local content_type="$3"
            curl -f -X POST \
              "${SUPABASE_URL}/storage/v1/object/extension-releases/${destination}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: ${content_type}" \
              -H "x-upsert: true" \
              --data-binary "@${source}"
          }

          upload apps/extension/build/version.json version.json application/json
          upload "${{ steps.artifact.outputs.versioned }}" "patina-capture-${VERSION}.zip" application/zip
          upload "${{ steps.artifact.outputs.latest }}" patina-capture-beta-latest.zip application/zip

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.versioned }}
          generate_release_notes: true
          prerelease: true
