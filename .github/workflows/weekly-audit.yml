name: Weekly repository audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Dependency and lifecycle audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate lifecycle report
        run: node scripts/hooks/patina-hooks.mjs audit --json > lifecycle-audit.json

      - name: Check skill contracts
        run: pnpm lint:skills

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-audit-${{ github.run_id }}
          path: lifecycle-audit.json
          if-no-files-found: warn
          retention-days: 30
