name: Policy and affected quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: policy-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Security policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check changed paths and content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          node scripts/hooks/patina-hooks.mjs policy --base "$BASE_SHA" --head HEAD --strict

      - name: Test the policy engine
        run: node --test scripts/hooks/*.test.mjs

  plan:
    name: Affected plan
    runs-on: ubuntu-latest
    outputs:
      ios_patina: ${{ steps.plan.outputs.ios_patina }}
      ios_capture: ${{ steps.plan.outputs.ios_capture }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          node scripts/hooks/patina-hooks.mjs plan --base "$BASE_SHA" --head HEAD

  affected-quality:
    name: Affected quality (advisory)
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - name: Run affected build, type, lint, and unit gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          node scripts/hooks/patina-hooks.mjs verify --base "$BASE_SHA" --head HEAD --run --strict

  # Both iOS jobs run on the only GitHub-hosted image that ships Xcode 27.0:
  # the `xcode-27` label (macOS 27, arm64, public preview), per
  # actions/runner-images images/macos/xcode-27-arm64-Readme.md, image
  # 20260912.0186.1: Xcode 27.0 (27A266a), iOS 27.0 simulator runtime. Read
  # 2026-09-24. macos-26 tops out at Xcode 26.6 and macos-15 at older still, so
  # there is no fallback: the Select step fails the job on any other Xcode.
  ios-patina:
    name: Patina iOS gate (advisory)
    needs: plan
    if: needs.plan.outputs.ios_patina == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One path, not a glob: the image carries Xcode_27.0.app,
      # Xcode_27.0.0.app and Xcode_27_Release_Candidate.app for the same build,
      # and xcode-select takes exactly one argument.
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.' \
            || { echo "::error::expected Xcode 27, got: $(xcodebuild -version | head -1)"; exit 1; }

      - name: Create this job's simulator (iPhone 17, iOS 27)
        run: |
          runtime="$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS" and (.version | startswith("27.")))] | last | .identifier // empty')"
          if [[ -z "$runtime" ]]; then
            echo "::error::no iOS 27 simulator runtime on this runner"; xcrun simctl list runtimes; exit 1
          fi
          udid="$(xcrun simctl create "ci-patina-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")"
          echo "created $udid on $runtime"
          echo "IOS_GATE_UDID=$udid" >> "$GITHUB_ENV"

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            apps/mobile/Patina/.build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-xcode27-patina-spm-${{ hashFiles('apps/mobile/Patina/Patina.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Bootstrap gitignored secrets
        run: apps/mobile/Patina/scripts/bootstrap-worktree.sh

      # lint-delta gets the PR base explicitly: a pull_request checkout has no
      # local `main`, and the gate's default base falls back to a full lint.
      - name: Patina gate (build, PatinaTests, lint-delta)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          apps/mobile/Patina/scripts/ios-gate.sh all "$BASE_SHA"

      - name: Delete this job's simulator
        if: always() && env.IOS_GATE_UDID != ''
        run: |
          xcrun simctl shutdown "$IOS_GATE_UDID" 2>/dev/null || true
          xcrun simctl delete "$IOS_GATE_UDID"

  ios-capture:
    name: Capture iOS gate (advisory)
    needs: plan
    if: needs.plan.outputs.ios_capture == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One path, not a glob; see ios-patina.
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.' \
            || { echo "::error::expected Xcode 27, got: $(xcodebuild -version | head -1)"; exit 1; }

      - name: Create this job's simulator (iPhone 17, iOS 27)
        run: |
          runtime="$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS" and (.version | startswith("27.")))] | last | .identifier // empty')"
          if [[ -z "$runtime" ]]; then
            echo "::error::no iOS 27 simulator runtime on this runner"; xcrun simctl list runtimes; exit 1
          fi
          udid="$(xcrun simctl create "ci-capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")"
          echo "created $udid on $runtime"
          echo "CAPTURE_SIM_UDID=$udid" >> "$GITHUB_ENV"

      # The portable release binary, checksum-pinned; capture-gate.sh refuses
      # any other version. The image ships no SwiftLint of its own.
      - name: Install SwiftLint 0.65.1
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          dir="$RUNNER_TEMP/swiftlint"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/portable_swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $dir/portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -q -o "$dir/portable_swiftlint.zip" -d "$dir"
          "$dir/swiftlint" version
          echo "$dir" >> "$GITHUB_PATH"

      # The generator runs on the macOS system Ruby (2.6, Bundler 1.17.2), the
      # toolchain that wrote Gemfile.lock. The image's default Ruby 3.4 cannot
      # load it: CFPropertyList 2.3.6 requires kconv and base64, which Ruby 3.4
      # dropped from the default gems. A shim dir puts only ruby and bundle
      # ahead of Homebrew; the bundle and its config live outside the checkout.
      - name: Install the Capture generator bundle (xcodeproj 1.27.0)
        working-directory: apps/mobile/Capture
        run: |
          shim="$RUNNER_TEMP/system-ruby"
          mkdir -p "$shim"
          ln -sf /usr/bin/ruby "$shim/ruby"
          ln -sf /usr/bin/bundle "$shim/bundle"
          export BUNDLE_PATH="$RUNNER_TEMP/capture-bundle"
          export BUNDLE_APP_CONFIG="$RUNNER_TEMP/capture-bundle-config"
          export BUNDLE_FROZEN=true
          /usr/bin/ruby -v
          /usr/bin/bundle install
          echo "$shim" >> "$GITHUB_PATH"
          {
            echo "BUNDLE_PATH=$BUNDLE_PATH"
            echo "BUNDLE_APP_CONFIG=$BUNDLE_APP_CONFIG"
            echo "BUNDLE_FROZEN=true"
          } >> "$GITHUB_ENV"

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            apps/mobile/Capture/.build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-xcode27-capture-spm-${{ hashFiles('apps/mobile/Capture/Capture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Bootstrap gitignored secrets
        run: apps/mobile/Capture/scripts/bootstrap-worktree.sh

      - name: Capture gate (build, CaptureTests, lint, sweeps)
        run: apps/mobile/Capture/scripts/capture-gate.sh all

      - name: Delete this job's simulator
        if: always() && env.CAPTURE_SIM_UDID != ''
        run: |
          xcrun simctl shutdown "$CAPTURE_SIM_UDID" 2>/dev/null || true
          xcrun simctl delete "$CAPTURE_SIM_UDID"
