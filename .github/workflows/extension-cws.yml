name: Extension — Chrome Web Store

on:
  push:
    tags:
      - 'extension-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only; do not upload/publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are set
        shell: bash
        run: |
          missing=()
          [ -z "${{ secrets.CWS_EXTENSION_ID }}" ] && missing+=("CWS_EXTENSION_ID")
          [ -z "${{ secrets.CWS_CLIENT_ID }}" ] && missing+=("CWS_CLIENT_ID")
          [ -z "${{ secrets.CWS_CLIENT_SECRET }}" ] && missing+=("CWS_CLIENT_SECRET")
          [ -z "${{ secrets.CWS_REFRESH_TOKEN }}" ] && missing+=("CWS_REFRESH_TOKEN")
          [ -z "${{ secrets.EXT_SUPABASE_URL }}" ] && missing+=("EXT_SUPABASE_URL")
          [ -z "${{ secrets.EXT_SUPABASE_ANON_KEY }}" ] && missing+=("EXT_SUPABASE_ANON_KEY")
          [ -z "${{ secrets.EXT_PORTAL_URL }}" ] && missing+=("EXT_PORTAL_URL")
          [ -z "${{ secrets.EXT_POSTHOG_KEY }}" ] && missing+=("EXT_POSTHOG_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/extension-v}"
          PACKAGE_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Version from package.json (dispatch)
        id: version_dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Quality gate
        run: |
          pnpm --filter @patina/extension type-check
          pnpm --filter @patina/extension test

      - name: Verify prod config parity
        env:
          EXT_SUPABASE_URL: ${{ secrets.EXT_SUPABASE_URL }}
          EXT_SUPABASE_ANON_KEY: ${{ secrets.EXT_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          HOST="$(node -e "console.log(new URL(process.env.EXT_SUPABASE_URL).host)")"
          if [ "$HOST" != "bkvcixdmuyejfzcijpdg.supabase.co" ]; then
            echo "EXT_SUPABASE_URL host ($HOST) is not the production Strata project (bkvcixdmuyejfzcijpdg.supabase.co)" >&2
            exit 1
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $EXT_SUPABASE_ANON_KEY" "$EXT_SUPABASE_URL/auth/v1/settings")
          echo "auth/v1/settings responded: $code"
          if [ "$code" != "200" ]; then
            echo "EXT_SUPABASE_ANON_KEY was rejected by $EXT_SUPABASE_URL/auth/v1/settings (HTTP $code)" >&2
            exit 1
          fi

          # apps/designer-portal/wrangler.jsonc is JSONC (line + block comments,
          # trailing commas) — strip both before JSON.parse. The top-level `vars`
          # block (not env.staging.vars) is the production config.
          WRANGLER_ANON_KEY="$(node -e "
            const fs = require('fs');
            let text = fs.readFileSync('apps/designer-portal/wrangler.jsonc', 'utf8');
            text = text.replace(/\/\*[\s\S]*?\*\//g, '');
            text = text.replace(/(^|[^:])\/\/.*$/gm, '\$1');
            text = text.replace(/,(\s*[}\]])/g, '\$1');
            const json = JSON.parse(text);
            console.log(json.vars.NEXT_PUBLIC_SUPABASE_ANON_KEY);
          ")"

          SECRET_HASH="$(printf '%s' "$EXT_SUPABASE_ANON_KEY" | sha256sum | cut -d' ' -f1)"
          WRANGLER_HASH="$(printf '%s' "$WRANGLER_ANON_KEY" | sha256sum | cut -d' ' -f1)"
          if [ "$SECRET_HASH" != "$WRANGLER_HASH" ]; then
            echo "anon key in EXT_SUPABASE_ANON_KEY differs from wrangler.jsonc production anon key" >&2
            exit 1
          fi

      - name: Build extension
        env:
          PLASMO_PUBLIC_SUPABASE_URL: ${{ secrets.EXT_SUPABASE_URL }}
          PLASMO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXT_SUPABASE_ANON_KEY }}
          PLASMO_PUBLIC_PORTAL_URL: ${{ secrets.EXT_PORTAL_URL }}
          PLASMO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXT_POSTHOG_KEY }}
        run: |
          pnpm --filter @patina/extension build
          pnpm --filter @patina/extension package

      # TODO(capture-launch W2): make blocking once fonts are bundled and OCR
      # removed. Today's tree still legitimately ships fonts.googleapis and
      # tesseract, so this step is expected to fail — continue-on-error keeps
      # the workflow usable until that wave lands.
      - name: Check bundle
        continue-on-error: true
        run: bash apps/extension/scripts/check-bundle.sh

      - name: Find built zip
        id: zip
        shell: bash
        run: |
          ZIP="$(find apps/extension/build -name '*.zip' | head -1)"
          if [ -z "$ZIP" ]; then
            echo "No packaged extension ZIP was produced" >&2
            exit 1
          fi
          SIZE="$(stat -c%s "$ZIP" 2>/dev/null || stat -f%z "$ZIP")"
          if [ "$SIZE" -lt 51200 ]; then
            echo "Packaged extension ZIP is suspiciously small ($SIZE bytes): $ZIP" >&2
            exit 1
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: patina-capture-${{ steps.version.outputs.version || steps.version_dispatch.outputs.version }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      # The CLI version is PINNED on purpose. Do not bump to 4.x without also
      # adding a CWS_PUBLISHER_ID secret: 4.x removed the --client-id /
      # --client-secret / --refresh-token flags (fregante/chrome-webstore-upload-cli#80)
      # AND moved to Chrome Web Store API v2, whose client hard-requires a
      # publisherId. 3.5.0 is the last release on the still-live v1.1 API, and it
      # already accepts every credential via environment variables.
      - name: Upload to Chrome Web Store
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3.5.0 upload \
            --source "${{ steps.zip.outputs.path }}"

      - name: Publish to Chrome Web Store
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3.5.0 publish

      - name: Publish result
        if: github.event_name == 'push' || inputs.dry_run == false
        run: echo "Publish request submitted to the Chrome Web Store — this SUBMITS the extension for Google review, it does not go live immediately."
