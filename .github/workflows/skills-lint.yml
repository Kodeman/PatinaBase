# Fast standalone validation for the canonical cross-agent skill tree.
name: Skills lint

on:
  push:
    paths:
      - '.agents/skills/**'
      - '.claude/skills'
      - 'scripts/lint-skills.mjs'
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.claude/skills'
      - 'scripts/lint-skills.mjs'

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/lint-skills.mjs
