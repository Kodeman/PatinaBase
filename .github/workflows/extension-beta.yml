name: Extension — Chrome Web Store Beta

on:
  push:
    tags:
      - "extension-beta-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only; do not upload/publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/extension-beta-v}"
          PACKAGE_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Version from package.json (dispatch)
        id: version_dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Brand beta manifest
        run: |
          node -e "const fs=require('fs');const p='apps/extension/package.json';const j=require('./'+p);j.displayName='Patina Capture BETA';j.description='THIS EXTENSION IS FOR BETA TESTING. '+j.description;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"

      - name: Test and package extension
        env:
          PLASMO_PUBLIC_SUPABASE_URL: ${{ secrets.EXT_SUPABASE_URL }}
          PLASMO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXT_SUPABASE_ANON_KEY }}
          PLASMO_PUBLIC_PORTAL_URL: ${{ secrets.EXT_PORTAL_URL }}
          PLASMO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXT_POSTHOG_KEY }}
        run: |
          pnpm --filter @patina/extension type-check
          pnpm --filter @patina/extension test
          pnpm --filter @patina/extension build
          pnpm --filter @patina/extension package

      - name: Check bundle
        run: bash apps/extension/scripts/check-bundle.sh

      - name: Find packaged extension
        id: zip
        shell: bash
        run: |
          ZIP="$(find apps/extension/build -name '*.zip' | head -1)"
          if [ -z "$ZIP" ]; then
            echo "No packaged extension ZIP was produced" >&2
            exit 1
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: patina-capture-${{ steps.version.outputs.version || steps.version_dispatch.outputs.version }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      # The CLI version is PINNED on purpose — see the note in extension-cws.yml.
      # 4.x drops the credential flags and requires a publisher ID we do not hold.
      - name: Upload beta to Chrome Web Store
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          EXTENSION_ID: ${{ secrets.CWS_BETA_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3.5.0 upload \
            --source "${{ steps.zip.outputs.path }}"

      - name: Publish unlisted beta
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          EXTENSION_ID: ${{ secrets.CWS_BETA_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3.5.0 publish
