<!-- s-M2 · Shared planks — Saved, opened where the pieces are.
     SP-12 (a door, and the right tab) · SP-14 (saved once, one currency formatter).
     Additions to the kit, scoped under .sp-saved: .sp-saved__new, .sp-saved__list, .saved-row__maker. -->
<div class="frame-wrap sp-saved">
  <style>
    .sp-saved .screen-head__title { font:400 26px/1.18 var(--pat-serif); }
    .sp-saved .sp-saved__new { color:var(--pat-text-link); }
    .sp-saved .sp-saved__new svg { width:22px; height:22px; }
    .sp-saved .sp-saved__list { padding:24px; display:flex; flex-direction:column; gap:12px; }
    .sp-saved .saved-row__maker { font:400 9px/1.5 var(--pat-mono); text-transform:uppercase;
      letter-spacing:.4px; color:var(--pat-text-muted); }
    .sp-saved .saved-row__thumb .tile-placeholder { border-radius:var(--pat-r-md); }
  </style>

  <div class="frame" data-scheme="light" data-battery="charging">
    <div class="frame__screen">

      <div class="screen-body screen-body--scroll">
        <div class="screen-head">
          <div class="screen-head__row">
            <span class="screen-head__title">Saved</span>
            <span class="icon-btn sp-saved__new"><svg><use href="#i-plus-circle"/></svg></span>
          </div>
        </div>

        <div class="tabs">
          <span class="tab"><span class="tab__label">Boards</span><span class="tab__rule"></span></span>
          <span class="tab tab--active"><span class="tab__label">All items</span><span class="tab__rule"></span></span>
        </div>

        <div class="sp-saved__list">
          <div class="saved-row">
            <span class="saved-row__thumb"><img src="img/heirloom-thumb.jpg" alt="Heirloom Oak Dining Table"></span>
            <span class="saved-row__copy">
              <span class="saved-row__maker">Nordic Atelier</span>
              <span class="saved-row__name">Heirloom Oak Dining Table</span>
              <span class="saved-row__price">$4,200</span>
            </span>
            <span class="saved-row__chev"><svg><use href="#i-chev-r"/></svg></span>
          </div>

          <div class="saved-row">
            <span class="saved-row__thumb"><img src="img/live-edge-coffee-table.jpg" alt="Live-Edge Coffee Table"></span>
            <span class="saved-row__copy">
              <span class="saved-row__maker">Heritage Lumber</span>
              <span class="saved-row__name">Live-Edge Coffee Table</span>
              <span class="saved-row__price">$2,100</span>
            </span>
            <span class="saved-row__chev"><svg><use href="#i-chev-r"/></svg></span>
          </div>

          <div class="saved-row">
            <span class="saved-row__thumb">
              <span class="tile-placeholder"><span class="strata strata--clay"><i></i><i></i><i></i></span></span>
            </span>
            <span class="saved-row__copy">
              <span class="saved-row__maker">Studio Piet</span>
              <span class="saved-row__name">Woven Jute Area Rug 8x10</span>
              <span class="saved-row__price">$1,450</span>
            </span>
            <span class="saved-row__chev"><svg><use href="#i-chev-r"/></svg></span>
          </div>
        </div>

        <div class="pad-hearth"></div>
      </div>

      <div class="screen-chrome">
        <span class="back-chevron"><svg><use href="#i-chev-l"/></svg></span>
      </div>

      <div class="companion-dock">
        <span class="orb"><span class="strata"><i></i><i></i><i></i></span></span>
      </div>

      <div class="statusbar">
        <span class="statusbar__time">9:41</span>
        <span class="statusbar__right">
          <span class="sb-signal"><i></i><i></i><i></i><i></i></span>
          <span class="sb-wifi"></span><span class="sb-battery"></span>
        </span>
      </div>
      <div class="island"></div>
      <div class="home-indicator"></div>
    </div>
  </div>

  <span class="callout-n" style="top:190px;right:24px">1</span>
  <span class="callout-n" style="top:250px;right:24px">2</span>
  <span class="callout-n" style="top:300px;right:24px">3</span>
  <span class="callout-n" style="top:493px;right:24px">4</span>
  <span class="callout-n callout-n--clay" style="top:773px;right:24px">5</span>
</div>
