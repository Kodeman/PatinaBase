<!-- b-M6a — Direction B · M6a · The Lock Screen: one push, one rectangular widget, no count.
     Drawn to Apple's metrics (kit.css §14); the status-bar clock is hidden because the Lock
     Screen owns the time. -->
<div class="frame-wrap bx-m6a">
<style>
.bx-m6a--lock .statusbar__time{visibility:hidden;}
.bx-m6a .lockscreen__clock{margin-top:78px;}
.bx-m6a .lockwidget{width:172px;margin:22px auto 0;padding:10px 12px;border-radius:14px;
  background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#fff;}
.bx-m6a .lockwidget__app{font:400 9px/1.4 var(--pat-mono);text-transform:uppercase;letter-spacing:1px;
  opacity:.7;}
.bx-m6a .lockwidget__line{font:500 14px/1.3 var(--pat-sans);margin-top:3px;}
.bx-m6a .push-banner__app,.bx-m6a .push-banner__title,.bx-m6a .push-banner__body{display:block;}
.bx-m6a .lock-notifs{position:absolute;left:0;right:0;bottom:88px;display:flex;justify-content:center;}
</style>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><symbol id="i-strata-x" viewBox="0 0 24 24"><path d="M0 0h0"/></symbol></svg>

<div class="frame bx-m6a--lock" data-scheme="dark" data-battery="charging">
  <div class="frame__screen">
    <div class="lockscreen">
      <div class="lockscreen__clock">
        <div class="lockscreen__date">Wednesday, August 26</div>
        <div class="lockscreen__time">9:12</div>
      </div>
      <div class="lockwidget">
        <div class="lockwidget__app">Patina</div>
        <div class="lockwidget__line">Rug colour &mdash; asked Aug 22</div>
      </div>
    </div>

    <div class="lock-notifs">
      <div class="push-banner">
        <span class="push-banner__icon"><span class="strata"><i></i><i></i><i></i></span></span>
        <span class="push-banner__copy">
          <span class="push-banner__app">Patina</span>
          <span class="push-banner__title">Leah sent a proposal</span>
          <span class="push-banner__body">Aspen Loft &mdash; Living Room Refresh &middot; review by Sep 8</span>
        </span>
        <span class="push-banner__time">now</span>
      </div>
    </div>

    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__right">
        <span class="sb-signal"><i></i><i></i><i></i><i></i></span>
        <span class="sb-wifi"></span><span class="sb-battery"></span>
      </span>
    </div>
    <div class="island"></div>
    <div class="home-indicator"></div>
  </div>
</div>

<span class="callout-n callout-n--ondark" style="top:296px;left:2px">2</span>
<span class="callout-n callout-n--clay callout-n--ondark" style="bottom:150px;left:2px">1</span>
</div>
