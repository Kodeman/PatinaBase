<!-- s-M4 · Shared planks — the permission moment, explained before it is asked.
     SP-08 (the sentence is verbatim; the ask moves to the first event a client would want to hear about).
     Headline and buttons follow Direction A M8; Direction B words the headline "Four things, and nothing
     else." and names a fourth event (an order moving).
     Additions to the kit, scoped under .sp-primer. -->
<div class="frame-wrap sp-primer">
  <style>
    .sp-primer .sp-primer__body { padding:calc(var(--pat-safe-top) + 72px) var(--pat-gutter-push) 0;
      display:flex; flex-direction:column; }
    .sp-primer .sp-primer__mark { padding-bottom:28px; }
    .sp-primer .sp-primer__title { font:400 26px/1.18 var(--pat-serif); color:var(--pat-text);
      padding-bottom:14px; }
    .sp-primer .sp-primer__promise { font:400 16px/1.45 var(--pat-sans); color:var(--pat-text-2);
      padding-bottom:28px; }
    .sp-primer .sp-primer__list { display:flex; flex-direction:column; gap:14px; }
    .sp-primer .sp-primer__item { display:flex; align-items:center; gap:12px; }
    .sp-primer .sp-primer__dot { width:6px; height:6px; border-radius:50%;
      background:var(--pat-clay); flex:0 0 auto; }
    .sp-primer .sp-primer__acts { position:absolute; left:var(--pat-gutter-push);
      right:var(--pat-gutter-push); bottom:44px; display:flex; flex-direction:column;
      align-items:center; gap:8px; }
  </style>

  <div class="frame" data-scheme="light" data-battery="charging">
    <div class="frame__screen">

      <div class="screen-body">
        <div class="sp-primer__body">
          <span class="sp-primer__mark"><span class="strata strata--spec"><i></i><i></i><i></i></span></span>
          <span class="sp-primer__title">Only when something needs you.</span>
          <span class="sp-primer__promise">We&rsquo;ll tell you when your designer sends something that needs
            you &mdash; a decision, a proposal, or an invoice. Nothing else.</span>

          <div class="sp-primer__list">
            <span class="sp-primer__item"><span class="sp-primer__dot"></span><span class="mono-label">A decision to make</span></span>
            <span class="sp-primer__item"><span class="sp-primer__dot"></span><span class="mono-label">A proposal to read</span></span>
            <span class="sp-primer__item"><span class="sp-primer__dot"></span><span class="mono-label">An invoice coming due</span></span>
          </div>
        </div>

        <div class="sp-primer__acts">
          <span class="btn btn--primary">Turn on notifications</span>
          <span class="btn btn--ghost">Not now</span>
        </div>
      </div>

      <div class="statusbar">
        <span class="statusbar__time">9:41</span>
        <span class="statusbar__right">
          <span class="sb-signal"><i></i><i></i><i></i><i></i></span>
          <span class="sb-wifi"></span><span class="sb-battery"></span>
        </span>
      </div>
      <div class="island"></div>
      <div class="home-indicator"></div>
    </div>
  </div>

  <span class="callout-n" style="top:147px;right:24px">1</span>
  <span class="callout-n" style="top:200px;right:24px">2</span>
  <span class="callout-n" style="top:390px;right:24px">3</span>
  <span class="callout-n" style="top:743px;right:24px">4</span>
  <span class="callout-n callout-n--clay" style="top:803px;right:24px">5</span>
</div>
