.frag-spine-before-360 .sb-putdown{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-meta);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--color-charcoal,var(--text-primary));margin-bottom:20px;}

.frag-spine-before-360 .sb-marks i:nth-child(5),

.frag-spine-before-360 .sb-row.is-current .sb-name{font-weight:600;}
.frag-spine-before-360 .sb-row .sb-value{display:block;margin-top:2px;font-family:var(--font-meta);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);}
