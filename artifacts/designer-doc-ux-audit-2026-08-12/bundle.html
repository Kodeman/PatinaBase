hanges.",evidence:"Live walk + source order"},{n:"04",severity:"High",title:"The transition to Install removes structure at the moment it matters most",body:"Project groups FF&E by room and carries rich coordination. Install flattens the list and drops the same coordination surface, just when the designer needs placement, delivery, damage, punch, and site status.",evidence:"Source-backed · FF&E / doc route"},{n:"05",severity:"High",title:"“Next up” competes with a dozen other visible acts",body:"The guide promises one next action, while the opening stack also exposes messaging, preview, scan, sharing, call sheet, folio, approvals, schedule controls, handoffs, and margin actions.",evidence:"Observed in production"},{n:"06",severity:"High",title:"Closeout arrives early—and does not remember partial progress",body:"During installation, a large Care checklist and portfolio form can dominate the page. Its manual progress is local component state until final submission, so leaving or refreshing can erase an unfinished closeout session.",evidence:"Live walk + source-backed"},{n:"07",severity:"High",title:"There are too many answers to “where am I?”",body:"The seven-section spine, phase estimates, canonical workflow stage, schedule phases, and active-work guide all describe position using different vocabularies. None is individually wrong; together they create translation work.",evidence:"Live walk + source-backed"},{n:"08",severity:"Medium",title:"Supporting records are buried in a permanent long tail",body:"Drawings, mood boards, accounts, roster, and files stay far below active work regardless of phase. During install, a plan detail can be more urgent than an approval history—but layout priority never changes.",evidence:"Source order"},{n:"09",severity:"High",title:"Past Project becomes a dead-end when Install begins",body:"Once Project is settled, its spine row remains clickable, but only Brief through Proposal have review bodies. Installers can jump to Project history and land on an inert settled bar.",evidence:"Source-backed interaction failure"},{n:"10",severity:"High",title:"Quiet typography crosses into illegibility",body:"Important metadata is repeatedly rendered below the documented 12px floor. Low contrast, all-caps microcopy, and dense inline controls feel elegant at rest but expensive under field pressure.",evidence:"Source-backed + visual review"},{n:"11",severity:"High",title:"The handoff invites a completion it already knows is blocked",body:"Phase Handoffs can list unresolved blockers while leaving “Complete phase” enabled. The expected designer journey is to click a primary action and receive a server rejection instead of being guided to the blocking work.",evidence:"Source-backed · phase advance control"},{n:"12",severity:"High",title:"Mobile navigation points to work that is not there",body:"Room jump controls remain visible in Install and Care even though their room targets only exist in Project. Mobile handoff chips can also describe the next act without providing a way to perform it.",evidence:"Source-backed · mobile document shell"},{n:"13",severity:"High",title:"Operational closeout is gated by portfolio production",body:"Photography, final portfolio images, and a written case study are treated as equal prerequisites alongside walkthrough, punch, and payment. A finished client engagement cannot settle until optional marketing work is also complete.",evidence:"Source-backed · closure derivation"}],b=[["Preserve the shell","Keep the full-bleed paper, spine, margin, and one-document focus. Those are the product’s strongest ideas."],["One lifecycle, three emphases","Project, Install, and Care should keep the same architecture; only default expansion and emphasis should change."],["One place for status","Spine = chapters. Masthead = current stage and next act. Schedule = time and dependency. No overlap."],["Progressive disclosure","Show one expanded work module. Reduce every other module to a scored summary with s
