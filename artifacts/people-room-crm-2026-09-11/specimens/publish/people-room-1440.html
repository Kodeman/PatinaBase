const P = {}; FIXTURE.persons.forEach(function (p) { P[p.id] = p; });
const C = {}; FIXTURE.companies.forEach(function (c) { C[c.id] = c; });
const RULE = {}; FIXTURE.rules.forEach(function (r) { RULE[r.person] = r; });

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function parts(iso) { const a = iso.split('-'); return { y: +a[0], m: +a[1], d: +a[2] }; }
function fmtShort(iso) { if (!iso) return ''; const t = parts(iso); return t.d + ' ' + MONTHS[t.m - 1].slice(0, 3) + ' ' + t.y; }
function fmtLong(iso) { if (!iso) return ''; const t = parts(iso); return t.d + ' ' + MONTHS[t.m - 1] + ' ' + t.y; }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function initials(name) {
  const w = name.replace(/[^A-Za-z ]/g, ' ').split(/\s+/).filter(Boolean);
  return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
}
function isPhone(v) { return /^\(\d{3}\) \d{3}-\d{4}$/.test(v); }
function tel(phone) {
  return '<a class="tel" href="tel:+1' + phone.replace(/\D/g, '') + '">' + esc(phone) + '</a>';
}
function linkPhones(text) {
  return esc(text).replace(/\(\d{3}\) \d{3}-\d{4}/g, function (m) { return tel(m); });
}

const TONE = {
  'Account': 'current', 'Field link': 'pending', 'On paper': 'dormant',
  'Texting': 'current', 'Invited': 'pending', 'Opted out': 'blocked', 'Not asked': 'dormant',
  'On the job': 'current', 'Awarded': 'pending', 'No response': 'dormant',
  'Off the job': 'dormant', 'Warranty': 'dormant',
  'Current': 'current', 'Lapsed': 'blocked', 'Not on file': 'dormant', 'Lapses in 30 days': 'pending'
};
function wordEl(w, extra, tone) {
  if (!w) return '';
  return '<span class="word word--' + (tone || TONE[w] || 'dormant') + (extra ? ' ' + extra : '') + '">' + esc(w) + '</span>';
}
function gap() { return '<span class="word-gap" aria-hidden="true"></span>'; }

const CHEV = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">' +
  '<path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="1"></path></svg>';

const SOURCE_WORDS = {
  'written': 'Written consent', 'verbal': 'Verbal consent',
  'web form': 'Web form consent', 'inbound text': 'Consent by text'
};
function consentSentence(id) {
  const c = CONSENT[id];
  if (!c) return '';
  const lead = c.state === 'Opted out' ? 'Opted out by text' : SOURCE_WORDS[c.source];
  return lead + ', ' + fmtShort(c.recorded) + ', on the ' + c.originJob + '.';
}

/* A firm staffed only by inspectors or lenders holds no compliance paper for the studio. */
function noPaperHeld(co) {
  const crew = FIXTURE.persons.filter(function (p) { return p.company === co.id; });
  if (!crew.length) return false;
  return crew.every(function (m) { return ENG[m.id] && ENG[m.id].kind === 'inspector'; });
}
function firmSub(c) {
  return c.kind + ' · ' + c.crew + ' on the crew · ' + c.jobs + ' open ' + (c.jobs === 1 ? 'job' : 'jobs');
}
function personSub(p) {
  const e = ENG[p.id];
  const tail = e ? (e.trade || e.kind) : p.roleAtFirm;
  const co = p.company ? C[p.company] : null;
  return (co ? co.name : p.roleAtFirm) + ' · ' + tail;
}
function seatLine(e) {
  return FIXTURE.project.name + ' · ' + e.kind + ' · ' + e.trade + ' · ' + e.stage +
    ' · ' + fmtShort(e.from) + ' to ' + fmtShort(e.to);
}
/* Routed contact: the email when there is one, then the office phone as a tel: link. Never a bare phone string. */
function routeChannels(id) {
  const list = FIXTURE.channels[id] || [];
  const out = [];
  const em = list.filter(function (x) { return x.kind === 'Email' && x.value; })[0];
  if (em) out.push(esc(em.value));
  const ph = list.filter(function (x) { return x.kind === 'Office' && isPhone(x.value); })[0] ||
    list.filter(function (x) { return isPhone(x.value); })[0];
  if (ph) out.push(tel(ph.value));
  return out;
}
function routeWrite(id) {
  const to = P[id];
  if (!to) return '';
  const ch = routeChannels(id);
  return 'Write ' + esc(to.name) + (ch.length ? ' · ' + ch.join(' · ') : '');
}
function clausesFor(p) {
  const out = [];
  const r = RULE[p.id];
  if (r) out.push({ text: r.text, block: !!r.block, route: (r.block && r.routeTo && P[r.routeTo]) ? r.routeTo : null });
  const c = CONSENT[p.id];
  if (c && c.state === 'Opted out') out.push({ text: c.note, block: false, route: null });
  return out;
}
function clauseHtml(list) {
  return list.map(function (c) {
    return '<div class="row-rule' + (c.block ? ' row-rule--blocked' : '') + '">' + esc(c.text) +
      (c.route ? '<span class="clause-route">' + routeWrite(c.route) + '</span>' : '') + '</div>';
  }).join('');
}

function docCells(doc) {
  const blocks = doc.blocks.join(', ');
  const expires = doc.expires ? fmtShort(doc.expires) : (doc.issued ? 'On file ' + fmtShort(doc.issued) : '—');
  const stops = doc.state !== 'Current' && doc.blocks.length ? 'blocked' : null;
  return '<tr>' +
    '<td>' + esc(doc.type) + '</td>' +
    '<td>' + esc(doc.number || '—') + '</td>' +
    '<td>' + esc(doc.issuer || '—') + '</td>' +
    '<td>' + esc(expires) + '</td>' +
    '<td>' + wordEl(doc.state, 'word--inline', stops) + '</td>' +
    '<td>' + (doc.heldBy === 'studio' ? 'The studio' : esc(doc.heldBy)) + '</td>' +
    '<td>' + esc(blocks.charAt(0).toUpperCase() + blocks.slice(1)) + '</td>' +
  '</tr>';

  const sa = FIXTURE.siteAccess;

  const bands = [
    { key: 'studio', title: 'Studio side', apart: false, start: false },
    { key: 'client', title: 'Client side', apart: false, start: false },
    { key: 'week', title: 'On the job · this week', apart: false, start: false },
    { key: 'later', title: 'On the job · later', apart: false, start: true },

  bands.forEach(function (b) {

      return e.person ? rosterPersonRow(e, { showStart: b.start }) : rosterFirmRow(e);
    }).join('') + '</div>');
    H.push('</div>');
  });

  H.push('</div>');
  return H.join('');
}

const KINDS = ['a client', 'a household member', 'a maker', 'a GC', 'a sub', 'an installer', 'a receiver', 'someone else'];
/* Each kind opens the sheet on the person the fixture already holds for it; the sub is SPEC's own sheet. */
const KIND_SOURCE = {
  'a client': 'F-04', 'a household member': 'F-05', 'a maker': 'F-20',
  'a GC': 'F-07', 'a receiver': 'F-06', 'someone else': 'F-27'
};
const KIND_FIRM = { 'a maker': 1, 'a GC': 1, 'a sub': 1, 'an installer': 1, 'someone else': 1 };
let addKind = FIXTURE.addSheet.kind;

function sheetFor(kind) {
  const base = FIXTURE.addSheet;
  if (kind === base.kind) return base;
  const p = P[KIND_SOURCE[kind]] || null;
  const e = p ? ENG[p.id] : null;
  const r = p ? RULE[p.id] : null;
  const c = p ? CONSENT[p.id] : null;
  const co = p && p.company ? C[p.company] : null;
  const name = p ? p.name : '';
  const auth = e && e.authority ? e.authority : '';
  return {
    dateline: base.dateline,
    kind: kind,
    project: base.project,
    name: name,
    firm: co ? co.name : '',
    trade: e && e.trade ? e.trade : '',
    channels: [
      { kind: 'Mobile', value: p && p.phone ? p.phone : '' },
      { kind: 'Email', value: p && p.email ? p.email : '' }
    ],
    rule: r ? r.text : '',
    authority: auth,
    consent: c ? { checked: true, method: c.source, evidence: c.note } : null,
    consequence: name
      ? 'Adding ' + name + ' puts them on the ' + base.project + ' Call Sheet' +
        (auth ? ' and records the authority above' : '') + '. It never opens billing or the agreement.'
      : 'Nothing is added to the ' + base.project + ' Call Sheet until you name someone.',
    terminal: base.terminal
  };
}

    H.push(field('WHERE AND WHEN THEY AGREED', 'f-evidence', a.consent.evidence, 'prose'));
    if (a.kind === FIXTURE.addSheet.kind) {
      H.push('<p class="t-body-sm">He is invited, not consenting, until he replies YES.</p>');
    }
  } else {
    H.push('<div class="check-line"><input type="checkbox" id="f-consent">' +
      '<label for="f-consent">They gave prior express consent for text updates</label></div>');
    H.push('<p class="t-body-sm">No consent recorded yet.</p>');
  }
  H.push('</div>');

  H.push('<div class="card-region">');
  H.push('<p class="t-body-sm consequence">' + esc(a.consequence) + '</p>');
  H.push('<button type="button" class="act act--terminal">' + esc(a.terminal) + '</button>');
  H.push('</div>');

  H.push('</div>');
  return H.join('');
}

/* ── the site access card ─────────────────────────────────────────── */
function renderAccess() {
  const sa = FIXTURE.siteAccess;
  const H = [];
  H.push('<div class="crm-card">');

  H.push('<h2 class="crm-h">Site access · ' + esc(sa.project) + '</h2>');
  H.push('<p class="t-body lede">' + esc(sa.address) + '</p>');
  H.push('<p class="t-body-sm">Studio only. This card never reaches a client page.</p>');

  H.push('<div class="card-region"><h3>Who to call first</h3>');
  sa.callFirst.forEach(function (c) {
    H.push('<p class="t-body-sm">' + esc(P[c.person].name) + ', ' + esc(c.role) + ', ' + tel(c.phone) + '</p>');
  });
  H.push('</div>');

  H.push('<div class="card-region"><h3>The way in</h3>');
  H.push('<p class="t-body-sm">' + esc(sa.wayIn) + '</p>');
  H.push('<p class="t-body-sm">' + esc(sa.gateControl) + '</p>');
  H.push('</div>');

  H.push('<div class="card-region"><h3>Key holder</h3>');
  H.push('<div class="fact-line"><span class="t-body-sm">' + linkPhones(sa.keyHolder.line) + '</span>' +
    wordEl(P[sa.keyHolder.person].consent, 'word--inline') + '</div>');
  H.push('</div>');

  H.push('<div class="card-region"><h3>Hours</h3>');
  H.push('<p class="t-body-sm">' + esc(sa.hours) + '</p>');
  H.push('</div>');

  H.push('<div class="card-region"><h3>Receiving</h3>');
  H.push('<p class="t-body-sm">' + esc(sa.receiving) + '</p>');
  H.push('</div>');

  H.push('<div class="card-region"><h3>Who was told</h3>');
  sa.changeLog.slice().sort(function (x, y) { return x.when < y.when ? 1 : -1; }).forEach(function (c) {
    const names = c.told.map(function (id) { return P[id].name; }).join(', ');
    H.push('<p class="t-body-sm">' + esc(c.what + ' ' + fmtLong(c.when) + ', by ' + c.by + '. Told: ' + names + '.') + '</p>');
  });
  H.push('<button type="button" class="act act--secondary js-disclose" aria-expanded="false" aria-controls="told-band">Log who was told</button>');
  H.push('<div class="inline-band" id="told-band" hidden>' +
    '<div class="field"><label class="t-head field-label" for="f-told">WHAT CHANGED AND WHO YOU TOLD</label>' +
    '<textarea class="control" id="f-told" rows="3"></textarea></div>' +
    '<button type="button" class="act">Save this note</button></div>');
  H.push('</div>');

  H.push('</div>');
  return H.join('');
}

/* ── the state switcher ───────────────────────────────────────────── */
const STATES = ['state-directory', 'state-person', 'state-company', 'state-roster', 'state-pick', 'state-add', 'state-access'];
const NAMES = {
  'state-directory': 'Directory',
  'state-person': 'Person card',
  'state-company': 'Company card',
  'state-roster': 'Project roster',
  'state-pick': 'Bring forward',
  'state-add': 'Add sheet',
  'state-access': 'Site access'
};
const FACES = {
  'state-directory': 'face-directory',
  'state-person': 'face-person',
  'state-company': 'face-company',
  'state-roster': 'face-roster',
  'state-pick': 'face-pick',
  'state-add': 'face-add',
  'state-access': 'face-access'
};

const say = document.getElementById('say');
function announce(text) { say.textContent = text; }

function paint() {
  document.getElementById('face-directory').innerHTML = renderDirectory();
  document.getElementById('face-person').innerHTML = renderPerson();
  document.getElementById('face-company').innerHTML = renderCompany();
  document.getElementById('face-roster').innerHTML = renderRoster();
  document.getElementById('face-pick').innerHTML = renderPick();
  document.getElementById('face-add').innerHTML = renderAdd();
  document.getElementById('face-access').innerHTML = renderAccess();
}

function readHash() {
  const raw = String(location.hash || '').replace(/^#/, '');
  const tokens = raw.split(/[&,]/).filter(Boolean);
  let state = 'state-directory';
  for (let i = 0; i < tokens.length; i++) {
    if (tokens[i].indexOf('state-') === 0) {
      if (STATES.indexOf(tokens[i]) !== -1) state = tokens[i];
      break;
    }
  }
  return { state: state, nobar: tokens.indexOf('nobar') !== -1 };
}

function apply(state, nobar) {
  STATES.forEach(function (s) {
    document.getElementById(FACES[s]).hidden = (s !== state);
  });
  const bar = document.querySelector('.bar');
  bar.hidden = !!nobar;
  Array.from(bar.querySelectorAll('[data-go]')).forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-go') === state));
  });
  document.getElementById('room-count').hidden = (state !== 'state-directory');
  const band = document.querySelector('.crm-band');
  band.classList.toggle('band--card', state === 'state-person' || state === 'state-company' || state === 'state-add');
  band.classList.toggle('band--sheet', state === 'state-roster' || state === 'state-access');
  band.classList.toggle('band--pick', state === 'state-pick');
  announce(NAMES[state]);
}

function fromHash() {
  const h = readHash();
  apply(h.state, h.nobar);
}

function openPerson(id) {
  if (!P[id]) return;
  personId = id;
  document.getElementById('face-person').innerHTML = renderPerson();
  goto('state-person');
}

function openCompany(id) {
  if (!C[id]) return;
  companyId = id;
  document.getElementById('face-company').innerHTML = renderCompany();
  goto('state-company');
}

function goto(state) {
  if (STATES.indexOf(state) === -1) return;
  if (location.hash.replace(/^#/, '') === state) { fromHash(); return; }
  location.hash = state;
}

document.addEventListener('click', function (ev) {
  const go = ev.target.closest('[data-go]');
  if (go) { goto(go.getAttribute('data-go')); return; }

  const disclose = ev.target.closest('.js-disclose');
  if (disclose) {
    const panel = document.getElementById(disclose.getAttribute('aria-controls'));
    const open = disclose.getAttribute('aria-expanded') === 'true';
    disclose.setAttribute('aria-expanded', String(!open));
    if (panel) panel.hidden = open;
    return;
  }

  const saveAuth = ev.target.closest('.js-save-authority');
  if (saveAuth) {
    const box = document.getElementById('f-authority-edit');
    const line = document.getElementById('seat-authority');
    if (box && line) line.textContent = box.value;
    const trigger = document.querySelector('[aria-controls="authority-band"]');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
    const band = document.getElementById('authority-band');
    if (band) band.hidden = true;
    announce('Authority saved.');
    return;
  }

  const confirmAuth = ev.target.closest('.js-authority');
  if (confirmAuth) {
    const note = document.getElementById('authority-note');
    if (note) note.textContent = 'Authority recorded for this seat.';
    announce('Authority recorded.');
    return;
  }

  const putBack = ev.target.closest('.js-putback');
  if (putBack) {
    Array.from(document.querySelectorAll('.pick-check input')).forEach(function (b) { b.checked = false; });
    pickUpdate();
    announce('Put back.');
    return;
  }

  const kindPick = ev.target.closest('.js-kind');
  if (kindPick) {
    addKind = kindPick.getAttribute('data-kind');
    document.getElementById('face-add').innerHTML = renderAdd();
    announce('Adding ' + addKind + '.');
    return;
  }

  const pick = ev.target.closest('.js-pick');
  if (pick) {
    const group = pick.closest('[role="group"]');
    Array.from(group.querySelectorAll('.js-pick')).forEach(function (b) {
      b.setAttribute('aria-pressed', String(b === pick));
    });
    announce(pick.textContent);
    return;
  }

  const lens = ev.target.closest('.js-lens');
  if (lens) {
    const group = lens.closest('[role="group"]');
    Array.from(group.querySelectorAll('.js-lens')).forEach(function (b) {
      const on = b === lens;
      b.setAttribute('aria-pressed', String(on));
      b.className = on ? 'act js-lens' : 'act act--tertiary js-lens';
    });
    announce(lens.textContent);
    return;
  }

  const company = ev.target.closest('[data-company]');
  if (company) { openCompany(company.getAttribute('data-company')); return; }

  const person = ev.target.closest('[data-person]');
  if (person) { openPerson(person.getAttribute('data-person')); }
});

document.addEventListener('change', function (ev) {
  if (ev.target.closest('.pick-check')) {
    const n = pickUpdate();
    announce(n + ' of 5 selected.');
  }
});

window.addEventListener('hashchange', fromHash);

window.addEventListener('message', function (ev) {
  const data = ev.data;
  if (!data || typeof data !== 'object') return;
  let s = data.state;
  if (typeof s !== 'string') return;
  if (s.indexOf('state-') !== 0) s = 'state-' + s;
  if (STATES.indexOf(s) === -1) return;
  goto(s);
});

document.addEventListener('DOMContentLoaded', function () { paint(); fromHash(); });
if (document.readyState !== 'loading') { paint(); fromHash(); }
</script>
