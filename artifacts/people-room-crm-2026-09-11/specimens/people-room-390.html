    if (chans) { out += '</ul>'; }

    /* R-V: the region prints on every card, with its sub-head and its fallback line. */
    out += '<p class="sub-head">Contact rule</p>';
    if (r) {
      out += '<p class="t-body prose' + (r.block ? ' row-rule--blocked' : '') + '">' +
        esc(r.text + ' Set by ' + r.setBy + ', ' + dlong(r.setAt) + '.') + '</p>';
      if (r.block && r.routeTo && P[r.routeTo]) {
        out += '<p class="t-body-sm note prose">' + routeWrite(r.routeTo) + '</p>';
      }
      out += '<div class="actrow"><button type="button" class="act act--tertiary"><span class="act-label">Edit the rule</span></button></div>';
    } else {
      out += '<p class="t-body prose">No contact rule on file.</p>';
    }

    out += '<p class="sub-head">Access grants</p>';
    if (g) {
      out += '<p class="t-body prose">' + esc(g.tier + ' · ' + g.opens + ' · minted ' + dshort(g.granted) + ' · used ' + dshort(g.lastUsed) + ' · ' + g.endsWords) + '</p>';
      out += '<div class="actrow"><button type="button" class="act act--tertiary"><span class="act-label">Revoke</span></button></div>';
    } else {
      out += '<p class="t-body prose">No grant on file.</p>';
    }
    out += '</div>';

    /* Seats */
    out += '<div class="card-region"><h3>Seats on projects</h3>';
    if (e) {
      out += '<p class="t-body">' + esc([FIXTURE.project.name, e.kind, e.trade].filter(Boolean).join(' · ')) + '</p>';
      out += '<p class="words">' + word(e.stage) + '</p>';
      out += '<p class="t-body-sm note">' + esc(seatWindow(e)) + '</p>';
      out += '<p class="words" id="seat-authority">' + plainWord(e.authority ? e.authority : 'No authority on this job') + '</p>';
      out += '<p class="t-body-sm">' + esc(accessWords(e.access)) + '</p>';
      if (e.kind === 'sub') { out += '<p class="t-body-sm">Contracted through ' + esc(firm('marrow').name) + '</p>'; }
      if (e.kind === 'sub' || e.kind === 'maker') { out += '<p class="t-body-sm">Hidden from the client</p>'; }
      out += '<div class="actrow"><button type="button" class="act act--tertiary" data-disc="authority-band" aria-expanded="false" aria-controls="authority-band"><span class="act-label">Edit the authority</span></button></div>';
      out += '<div class="stack" id="authority-band" hidden>';
      out += '<div class="field"><label class="t-head field-label" for="f-authority-edit">AUTHORITY ON THIS JOB</label>';
      out += '<input class="control" type="text" id="f-authority-edit" value="' + esc(e.authority || 'No authority on this job') + '"></div>';
      out += '<div class="actrow"><button type="button" class="act js-save-authority"><span class="act-label">Save the authority</span></button></div>';
      out += '</div>';
    } else {
      out += '<p class="t-body">No open seat on this project.</p>';
    }
    out += '</div>';

    if (f && f.warrantyUntil) {
      out += '<div class="card-region"><h3>Past seats</h3>';
      out += '<p class="t-body">' + esc(FACE.pastSeat) + '</p>';
      out += '<p class="words">' + word('Warranty') + '</p></div>';
    }

    if (f && f.soleProprietor && f.documents) {
      const coi = f.documents[0];
      out += '<div class="card-region"><h3>Paper</h3>';
      out += '<p class="t-body prose">' + esc(coi.type + ' · ' + coi.number + ' · ' + coi.issuer + ' · expired ' + dlong(coi.expires)) + '</p>';
      out += '<p class="words">' + docWord(coi) + '</p>';
      out += '<p class="t-body-sm">' + esc(FACE.personBlocks) + '</p></div>';
    }

    if (f && f.history && g) {
      out += '<div class="card-region"><h3>History</h3>';
      out += '<p class="t-body prose">' + esc('Worked ' + f.jobs + " of the studio's projects. Last touch " + dlong(g.lastUsed) + ', text, logistics.') + '</p></div>';
    }

    if (p.consent === 'Texting' && p.phone) {
      const why = pid === 'F-11' ? FACE.textConsequence
        : 'This opens a text to ' + p.name + ' on the mobile they agreed to. Nothing sends until you send it.';
      out += '<div class="card-region"><p class="t-body-sm consequence">' + esc(why) + '</p>';
      out += '<div class="actrow"><button type="button" class="act"><span class="act-label">Send a text</span></button></div></div>';
    }
    out += '</div>';
    return out;
  }

  /* ── The company card ──────────────────────────────────────────────── */

  function paperStack(d) {
    let expires = '—';
    if (d.expires) { expires = dshort(d.expires); }
    else if (d.issued) { expires = 'On file ' + dshort(d.issued); }
    const cells = [
      ['Type', esc(d.type)],
      ['Number', esc(d.number || '—')],
      ['Issuer', esc(d.issuer || '—')],
      ['Expires', esc(expires)],
      ['State', docWord(d)],
      ['Held by', d.heldBy === 'studio' ? 'The studio' : esc(d.heldBy)],
      ['Blocks', esc(cap(d.blocks.join(', ')))]
    ];
    let out = '<li class="paper-doc">';
    cells.forEach(function (c) {
      out += '<p class="t-head">' + c[0] + '</p><p class="stack-val">' + c[1] + '</p>';
    });
    out += '</li>';
    return out;
  }

  function crewOf(cid) {
    const d = firm(cid).designations || {};
    const order = [];
    ['paperworkContact', 'signer', 'siteContact'].forEach(function (k) {
      if (d[k] && order.indexOf(d[k]) < 0) { order.push(d[k]); }
    });
    FIXTURE.persons.forEach(function (p) {
      if (p.company === cid && order.indexOf(p.id) < 0) { order.push(p.id); }
    });
    return order;
  }

  function crewLine(cid, pid) {
    const c = firm(cid);
    const d = c.designations || {};
    const p = person(pid);
    const bits = [p.roleAtFirm];
    if (d.paperworkContact === pid) { bits.push('paperwork contact'); }
    if (d.signer === pid) { bits.push('signer'); }
    if (d.siteContact === pid) { bits.push('site contact'); }
    const lic = (c.documents || []).filter(function (x) { return x.type.indexOf('licence') > -1; })[0];
    if (c.soleProprietor && lic) { bits.push('holds the trade licence'); }
    return bits.join(' · ');
  }

  function renderCompany(cid) {
    const c = firm(cid);
    const docs = c.documents || [];
    const held = docs.filter(docBlocks).length > 0;
    const seats = FIXTURE.engagements.filter(function (e) { return e.company === cid && e.person; });
    let meta = c.kind + ' · ' + (c.crew === 1 ? '1 person' : c.crew + ' people') + ' · ' + (c.jobs === 1 ? '1 project' : c.jobs + ' projects');
    if (c.warrantyUntil) { meta += ' · warranty through ' + dshort(c.warrantyUntil); }

    let out = '<div class="crm-card">';
    out += '<div class="card-header">';
    out += '<span class="avatar avatar--square" aria-hidden="true">' + esc(initials(c.name)) + '</span>';
    out += '<div><h2 class="card-name t-d3">' + esc(c.name) + '</h2>';
    out += '<p class="card-meta">' + esc(meta) + '</p></div></div>';

    out += '<div class="card-region"><h3>Crew &amp; designations</h3>';
    crewOf(cid).forEach(function (pid) {
      const r = ruleOf(pid);
      /* R-W: only the name is the control; the designations are plain text. */
      out += '<p class="prose"><button type="button" class="linkline" data-open-person="' + pid + '"><span>' + esc(nameOf(pid)) + '</span></button>' + esc(' · ' + crewLine(cid, pid)) + '</p>';
      if (r && r.block) {
        out += '<p class="row-rule row-rule--blocked">' + esc(r.text) + '</p>';
        if (r.routeTo && P[r.routeTo]) {
          out += '<p class="t-body-sm note prose">' + routeWrite(r.routeTo) + '</p>';
        }
      }
    });
    out += '</div>';

    out += '<div class="card-region"><h3>Paper</h3>';
    if (holdsNoPaper(cid)) {
      out += '<p class="t-body prose">No paper is held for this firm.</p></div>';
    } else {
      /* §5.3 #4 (R-P): the table, then the leading-rule clause, then the consequence, then the acts. */
      if (docs.length) {
        out += '<ul class="stack">' + docs.map(paperStack).join('') + '</ul>';
      } else {
        out += '<p class="words">' + word('Not on file') + '</p>';
      }
      if (held) {
        out += '<p class="t-body prose row-rule row-rule--blocked" style="margin-top:24px">' + esc(FACE.paperHeld) + '</p>';
        out += '<p class="t-body-sm consequence" id="chase-why" style="margin-top:12px">' + esc('This drafts a note to ' + c.name + "'s paperwork contact and files it for your review. Nothing is sent until you send it.") + '</p>';
      }
      out += '<div class="actrow">';
      out += '<button type="button" class="act act--secondary"><span class="act-label">Record a document</span></button>';
      if (held) { out += '<button type="button" class="act act--tertiary" aria-describedby="chase-why"><span class="act-label">Chase the renewal</span></button>'; }
      out += '</div>';
      out += '</div>';
    }

    if (c.payee) {
      out += '<div class="card-region"><h3>Payee</h3>';
      out += '<p class="t-body">Remit to ' + esc(c.payee.remitTo) + '</p>';
      out += '<p class="t-body">Tax id ending ' + esc(c.payee.taxIdLast4) + '</p>';
      out += '<p class="t-body">Retainage ' + esc(c.payee.retainage) + '</p></div>';
    }

    if (seats.length) {
      out += '<div class="card-region"><h3>Jobs</h3>';
      seats.forEach(function (e) {
        out += '<p class="t-body">' + esc(FIXTURE.project.name + ' · ' + nameOf(e.person) + ' · ') + wordInline(e.stage) + '</p>';
      });
      if (docs.filter(function (d) { return docBlocks(d) && d.blocks.indexOf('draw') > -1; }).length) {
        out += '<div class="actrow"><button type="button" class="act act--inline"><span class="act-label">' + esc(FACE.ledger) + '</span></button></div>';
      }
      out += '</div>';
    }

    if (c.history) {
      out += '<div class="card-region"><h3>History</h3>';
      out += '<p class="t-body prose">' + esc(c.history) + '</p></div>';
    }
    out += '</div>';
    return out;
  }

  /* ── The call sheet ────────────────────────────────────────────────── */

  function rosterPersonRow(e, showStart) {
    const p = person(e.person);
    const f = p.company ? firm(p.company) : null;
    const unfolded = e.person === 'F-11';
    const panelId = 'unfold-' + slug(p.name);
    const said = consentSentence(p.id);
    const acts = [];
    if (p.phone && p.consent === 'Texting') { acts.push('Text'); }
    if (p.reach === 'Field link') { acts.push('Copy field link'); }
    acts.push('Show to client');
    acts.push('Close this seat');
    let out = '<li class="crm-row" data-kind="' + esc(roleWord(e.kind)) + '">';
    out += '<div class="prow-top">';
    out += '<span class="avatar avatar--circle" aria-hidden="true">' + esc(initials(p.name)) + '</span>';
    out += '<div class="row-id">';
    out += '<button type="button" class="open-person" data-open-person="' + e.person + '">';
    out += '<span class="row-name">' + esc(p.name) + '</span>';
    out += '<span class="row-sub">' + esc(subLine(p)) + '</span></button>';
    if (e.authority) { out += '<p class="words">' + plainWord(e.authority) + '</p>'; }
    if (e.held) { out += '<p class="row-rule row-rule--blocked">' + esc(e.held) + '</p>'; }
    out += clauseHtml(clausesFor(p));
    if (showStart && e.from) { out += '<p class="t-body-sm note">Starts ' + esc(dshort(e.from)) + '</p>'; }
    if (e.bid) { out += '<p class="t-body-sm note">' + esc(e.bid) + '</p>'; }
    out += '</div></div>';
    out += '<div class="prow-line2">';
    out += '<span class="words">' + word(p.reach) + word(e.stage) + '</span>';
    out += telLink(p.phone);
    out += '<button type="button" class="disc" data-disc="' + panelId + '" aria-expanded="' + (unfolded ? 'true' : 'false') + '" aria-controls="' + panelId + '" aria-label="More about ' + esc(p.name) + '">More' + CHEV + '</button>';
    out += '</div>';
    out += '<div class="unfold" id="' + panelId + '"' + (unfolded ? '' : ' hidden') + '>';
    out += p.phone
      ? '<p class="t-body-sm note">Mobile</p>' + telLink(p.phone)
      : '<p class="t-body-sm note">No phone on file</p>';
    if (said) { out += '<p class="t-body-sm prose">' + esc(said) + '</p>'; }
    out += '<div class="words">' + (p.consent ? word(p.consent) : '') +
      (f && !holdsNoPaper(p.company) ? word(f.paper) : '') + '</div>';
    out += '<div class="actrow">';
    acts.forEach(function (a) {
      out += '<button type="button" class="act act--tertiary"><span class="act-label">' + esc(a) + '</span></button>';
    });
    out += '</div></div></li>';
    return out;
  }

  function rosterFirmRow(e) {
    const c = firm(e.company);
    const line = c.name + ' · ' + e.trade + ' · ' + (e.bid || e.closed);
    let out = '<li class="crm-row" data-kind="' + esc(roleWord(e.kind)) + '">';
    out += '<div class="prow-top">';
    out += '<span class="avatar avatar--square" aria-hidden="true">' + esc(initials(c.name)) + '</span>';
    out += '<div class="row-id"><p class="row-name prose">' + esc(line) + '</p></div></div>';
    out += '<div class="prow-line2 prow-line2--firm"><span class="words">' + word(e.stage) + '</span></div>';
    out += '</li>';
    return out;
  }

  /* The Call Sheet's site-access summary line, shared by the roster and the picker (R-U). */
  function siteHeadLine() {
    const sa = FIXTURE.siteAccess;
    const changed = sa.changeLog.slice().sort(function (a, b) { return a.when < b.when ? 1 : -1; })[0];
    return 'Key held by ' + nameOf(sa.keyHolder.person) + '. ' + sa.gateControl + ' Changed ' + dshort(changed.when) + '.';
  }

  function renderRoster() {
    let out = '<h2 class="t-d3">Call sheet · ' + esc(FIXTURE.project.name) + '</h2>';
    out += '<p class="t-body prose">' + esc(siteHeadLine()) + '</p>';
    out += '<div class="actrow"><button type="button" class="act act--inline" data-go="state-access"><span class="act-label">Open the site access card</span></button></div>';
    const onNow = FIXTURE.engagements.filter(function (e) {
      return e.person && (e.band === 'studio' || e.band === 'client' || e.band === 'week');
    }).map(function (e) { return person(e.person); });
    const tally = function (fn) { return onNow.filter(fn).length; };
    out += '<p class="t-meta vitals">' + esc(onNow.length + ' on the job this week · ' +
      tally(function (x) { return x.consent === 'Texting'; }) + ' reachable by text · ' +
      tally(function (x) { return x.reach === 'Account'; }) + ' with accounts · ' +
      tally(function (x) { return x.reach === 'On paper'; }) + ' on paper') + '</p>';

    const roles = [];
    FIXTURE.engagements.forEach(function (e) {
      const w = e.kind ? roleWord(e.kind) : '';
      if (w && roles.indexOf(w) < 0) { roles.push(w); }
    });
    out += '<div class="narrows" data-narrow="roster" role="group" aria-label="Narrow the call sheet by role">';
    out += '<button type="button" class="narrow" data-kind-pick="Everyone" aria-pressed="true">Everyone</button>';
    roles.forEach(function (w) {
      out += '<button type="button" class="narrow" data-kind-pick="' + esc(w) + '" aria-pressed="false">' + esc(w) + '</button>';
    });
    out += '</div>';

    out += '<div class="band"><h3 class="t-head">Studio side</h3><ul class="crm-list">';
    out += bandOf('studio').map(function (e) { return rosterPersonRow(e, false); }).join('') + '</ul></div>';

    out += '<div class="band"><h3 class="t-head">Client side</h3><ul class="crm-list">';
    out += bandOf('client').map(function (e) { return rosterPersonRow(e, false); }).join('') + '</ul></div>';

    out += '<div class="band"><h3 class="t-head">On the job · this week</h3><ul class="crm-list">';
    out += bandOf('week').map(function (e) { return rosterPersonRow(e, false); }).join('') + '</ul></div>';

    const later = bandOf('later').slice().sort(function (a, b) { return a.from < b.from ? -1 : (a.from > b.from ? 1 : 0); });
    out += '<div class="band"><h3 class="t-head">On the job · later</h3><ul class="crm-list">';
    out += later.map(function (e) { return rosterPersonRow(e, true); }).join('') + '</ul></div>';

    out += '<div class="band band--apart"><h3 class="t-head">Bidding</h3><ul class="crm-list">';
    out += bandOf('bidding').map(rosterFirmRow).join('') + '</ul></div>';

    out += '<div class="band band--apart"><h3 class="t-head">Done</h3><ul class="crm-list">';
    out += bandOf('done').map(rosterFirmRow).join('') + '</ul></div>';
    return out;
  }

  /* ── The add sheet ─────────────────────────────────────────────────── */

  function field(id, label, value, kind) {
    let out = '<div class="field"><label class="t-head field-label" for="' + id + '">' + label + '</label>';
    if (kind === 'area') {
      out += '<textarea class="control" id="' + id + '" rows="3">' + esc(value) + '</textarea>';
    } else {
      out += '<input class="control" type="text" id="' + id + '" value="' + esc(value) + '">';
    }
    out += '</div>';
    return out;
  }

  const ADD_KINDS = ['a client', 'a household member', 'a maker', 'a GC', 'a sub', 'an installer', 'a receiver', 'someone else'];
  /* Each kind stands for a real seat in the fixture, so picking one rewrites the whole sheet. */
  const ADD_EXAMPLE = {
    'a client': 'F-04', 'a household member': 'F-05', 'a maker': 'F-20',
    'a GC': 'F-07', 'a receiver': 'F-06', 'someone else': 'F-27'
  };
  const ADD_FIRM = { 'a maker': 1, 'a GC': 1, 'a sub': 1, 'an installer': 1, 'someone else': 1 };

  function addSheetFor(kind) {
    const a = FIXTURE.addSheet;
    if (kind === a.kind) {
      return {
        kind: a.kind, project: a.project, name: a.name, firm: a.firm, trade: a.trade,
        channels: a.channels.map(function (c) { return { label: c.kind.toUpperCase(), value: c.value }; }),
        rule: a.rule, authority: '',
        consented: a.consent.checked, method: a.consent.method, evidence: a.consent.evidence,
        invited: FACE.invited, consequence: a.consequence
      };
    }
    const pid = ADD_EXAMPLE[kind];
    const p = pid ? person(pid) : null;
    const e = p ? seatOf(p.id) : null;
    const r = p ? ruleOf(p.id) : null;
    const c = p ? consentOf(p.id) : null;
    const f = p && p.company ? firm(p.company) : null;
    const auth = e && e.authority ? e.authority : '';
    const nm = p ? p.name : '';
    return {
      kind: kind, project: a.project, name: nm,
      firm: f ? f.name : '', trade: e && e.trade ? e.trade : '',
      channels: [
        { label: 'MOBILE', value: p && p.phone ? p.phone : '' },
        { label: 'EMAIL', value: p && p.email ? p.email : '' }
      ],
      rule: r ? r.text : '',
      authority: auth,
      consented: !!c, method: c ? c.source : 'verbal', evidence: c ? c.note : '',
      invited: '',
      consequence: nm
        ? 'Adding ' + nm + ' puts them on the ' + a.project + ' Call Sheet' +
          (auth ? ' and records the authority above' : '') + '. It never opens billing or the agreement.'
        : 'Nothing is added to the ' + a.project + ' Call Sheet until you name someone.'
    };
  }

  function renderAdd() {
    const a = FIXTURE.addSheet;
    const sheet = addSheetFor(addKind);
    let out = '<p class="t-head eyebrow">ADD · TO YOUR ROSTER</p>';
    out += '<h2 class="t-d2">Bring someone in</h2>';
    out += '<p class="t-meta" style="margin-top:12px">' + esc(a.dateline) + '</p>';
    out += '<div class="narrows" data-narrow="add-kind" role="group" aria-label="What kind of person you are adding">';
    ADD_KINDS.forEach(function (k) {
      out += '<button type="button" class="narrow" data-kind-pick="' + esc(k) + '" aria-pressed="' +
        (k === sheet.kind ? 'true' : 'false') + '">' + esc(k) + '</button>';
    });
    out += '</div>';
    out += field('f-project', 'PROJECT', sheet.project);
    out += field('f-name', 'FULL NAME', sheet.name);
    if (ADD_FIRM[sheet.kind]) {
      out += field('f-firm', 'COMPANY', sheet.firm);
      out += field('f-trade', 'TRADE', sheet.trade);
    }

    out += '<h3 class="t-head" style="margin-top:48px">Channels</h3>';
    sheet.channels.forEach(function (c, i) {
      out += field('f-chan-' + i, esc(c.label), c.value);
    });
    out += field('f-rule', 'CONTACT RULE', sheet.rule);

    out += '<h3 class="t-head" style="margin-top:48px">Authority</h3>';
    out += field('f-authority', 'AUTHORITY ON THIS JOB', sheet.authority);
    out += '<p class="t-body-sm prose" id="authority-note" style="margin-top:12px">' +
      (sheet.authority ? 'Defaulted from the agreement. Confirm it, or write a different one.' : 'Nothing defaulted from the agreement.') + '</p>';
    out += '<div class="actrow"><button type="button" class="act act--tertiary js-authority"><span class="act-label">' +
      (sheet.authority ? 'Confirm from the agreement' : 'Record the authority') + '</span></button></div>';

    out += '<h3 class="t-head" style="margin-top:48px">Consent</h3>';
    out += '<div class="check"><input type="checkbox" id="f-consent"' + (sheet.consented ? ' checked' : '') + '>';
    out += '<label for="f-consent">They gave prior express consent for text updates</label></div>';
    out += '<div class="field"><label class="t-head field-label" for="f-method">HOW CONSENT WAS GIVEN</label>';
    out += '<div class="select-wrap"><select class="control" id="f-method">';
    ['verbal', 'written', 'web form', 'inbound text'].forEach(function (m) {
      out += '<option' + (m === sheet.method ? ' selected' : '') + '>' + esc(m) + '</option>';
    });
    out += '</select>' + SELECT_CHEV + '</div></div>';
    out += field('f-where', 'WHERE AND WHEN THEY AGREED', sheet.evidence, 'area');
    if (sheet.invited) { out += '<p class="t-body-sm prose" style="margin-top:12px">' + esc(sheet.invited) + '</p>'; }

    out += '<p class="t-body-sm consequence" style="margin-top:48px">' + esc(sheet.consequence) + '</p>';
    out += '<div class="actrow"><button type="button" class="act act--terminal"><span class="act-label">' + esc(a.terminal) + '</span></button></div>';
    return out;
  }

  /* ── Bring forward, the rolodex picker ─────────────────────────────── */

  const PICK_PRIOR = 'Worked 1 prior project, Lindqvist kitchen, closed 2025';
  const PICK_ROWS = [
    { id: 'F-11', firm: 'northgate',  trade: 'electrical',          picked: true,  line: PICK_PRIOR, consent: true, paper: true },
    { id: 'F-12', firm: 'rusk',       trade: 'plumbing',            picked: true,  line: PICK_PRIOR, consent: true,
      note: 'Opted out by text 3 Dec 2025, on the Lindqvist kitchen.' },
    { id: 'F-13', firm: 'halvorsen',  trade: 'cabinetry',           picked: true,  line: PICK_PRIOR, consent: true, rule: true },
    { id: 'F-20', firm: 'stonehaven', trade: 'tile & stone',        picked: true,  line: 'Saved twice, one firm.' },
    { id: 'L-02', firm: 'ostrom',     trade: 'general contracting', picked: false, line: PICK_PRIOR }
  ];
  const PICK_TRAVELS = ['Identity', 'Typed channels', 'Contact rule', 'Consent by channel value', 'Document expiries', 'One history line'];
  const PICK_STAYS = ['2025 pricing', '2025 project notes', 'Show to client'];

  function pickRow(row) {
    const p = person(row.id);
    const c = firm(row.firm);
    const boxId = 'pick-' + slug(p.name);
    let out = '<li class="crm-row">';
    out += '<div class="prow-top">';
    out += '<input class="pick-box" type="checkbox" id="' + boxId + '" data-who="' + slug(p.name) + '"' + (row.picked ? ' checked' : '') + '>';
    out += '<span class="avatar avatar--circle" aria-hidden="true">' + esc(initials(p.name)) + '</span>';
    out += '<div class="row-id">';
    out += '<label class="row-name pick-name" for="' + boxId + '">' + esc(p.name) + '</label>';
    out += '<span class="row-sub">' + esc(c.name + ' · ' + row.trade) + '</span>';
    if (row.rule) { out += '<p class="row-rule">' + esc(ruleOf(row.id).text) + '</p>'; }
    out += '<p class="t-body-sm note prose">' + esc(row.line) + '</p>';
    if (row.note) { out += '<p class="t-body-sm note prose">' + esc(row.note) + '</p>'; }
    out += '</div></div>';
    const pw = row.paper && !holdsNoPaper(row.firm) ? word(c.paper) : '';
    out += '<div class="prow-line2"><span class="words">' + pw + word(p.reach) +
      (row.consent ? word(p.consent) : '') + '</span></div>';
    out += '</li>';
    return out;
  }

  function renderPick() {
    let out = '<h2 class="t-d3">Call sheet · ' + esc(FIXTURE.project.name) + '</h2>';
    out += '<p class="t-body prose">' + esc(siteHeadLine()) + '</p>';
    out += '<div class="band">';
    out += '<p class="t-head eyebrow">OKONKWO RESIDENCE</p>';
    out += '<h3 class="t-d3">From the rolodex</h3>';
    out += field('f-pick-search', 'SEARCH THE ROLODEX', 'Lindqvist');
    out += '<p class="t-body-sm note prose vitals" id="pick-count">4 of 5 from the Lindqvist kitchen selected</p>';
    out += '<ul class="crm-list stack">' + PICK_ROWS.map(pickRow).join('') + '</ul>';
    out += '<h3 class="t-head" style="margin-top:48px">What travels</h3><ul>';
    PICK_TRAVELS.forEach(function (t) { out += '<li class="stack-row"><p class="t-body">' + esc(t) + '</p></li>'; });
    out += '</ul>';
    out += '<h3 class="t-head" style="margin-top:48px">What stays behind</h3><ul>';
    PICK_STAYS.forEach(function (t) { out += '<li class="stack-row"><p class="t-body">' + esc(t) + '</p></li>'; });
    out += '</ul>';
    out += '<div class="actrow" style="margin-top:48px">';
    out += '<button type="button" class="act act--terminal" id="pick-terminal" aria-describedby="pick-consequence"><span class="act-label">Add four to the roster</span></button>';
    out += '<button type="button" class="act act--secondary js-putback"><span class="act-label">Put back</span></button>';
    out += '</div>';
    out += '<p class="t-body-sm consequence" id="pick-consequence" style="margin-top:12px">' + esc(FACE.pickConsequence) + '</p>';
    out += '</div>';
    return out;
  }

  const NUMWORD = ['no', 'one', 'two', 'three', 'four', 'five'];

  function pickUpdate() {
    const boxes = Array.prototype.slice.call(document.querySelectorAll('.pick-box'));
    const on = boxes.filter(function (b) { return b.checked; });
    const n = on.length;
    const who = on.map(function (b) { return b.getAttribute('data-who'); });

    const count = document.getElementById('pick-count');
    if (count) { count.textContent = n + ' of ' + boxes.length + ' from the Lindqvist kitchen selected'; }

    const term = document.getElementById('pick-terminal');
    if (term) {
      const label = term.querySelector('.act-label') || term;
      label.textContent = n ? 'Add ' + NUMWORD[n] + ' to the roster' : 'Add to the roster';
      if (n) { term.removeAttribute('aria-disabled'); } else { term.setAttribute('aria-disabled', 'true'); }
    }

    const line = document.getElementById('pick-consequence');
    if (line) {
      const parts = ['Adds ' + NUMWORD[n] + ' seat' + (n === 1 ? '' : 's') + ' to the Okonkwo residence.'];
      if (who.indexOf('pete-rusk') > -1) { parts.push('Pete Rusk arrives opted out of texting.'); }
      if (who.indexOf('dana-kowalski') > -1) { parts.push("Northgate Electric's insurance lapsed 31 Mar 2026."); }
      line.textContent = parts.join(' ');
    }
    return n;
  }

  /* ── The site access card ──────────────────────────────────────────── */

  function renderAccess() {
    const sa = FIXTURE.siteAccess;
    let out = '<h2 class="t-d3">Site access · ' + esc(sa.project) + '</h2>';
    out += '<p class="t-body prose">' + esc(sa.address) + '</p>';
    out += '<p class="t-body-sm note prose">' + esc(FACE.studioOnly) + '</p>';

    out += '<div class="card-region"><h3>Who to call first</h3><ul>';
    sa.callFirst.forEach(function (c) {
      const line = nameOf(c.person) + ', ' + c.role + ', ' + c.phone;
      out += '<li class="stack-row"><a class="tel tel--line" href="' + telHref(c.phone) + '"><span>' + esc(line) + '</span></a></li>';
    });
    out += '</ul></div>';

    out += '<div class="card-region"><h3>The way in</h3>';
    out += '<p class="t-body prose">' + esc(sa.wayIn) + '</p>';
    out += '<p class="t-body prose" style="margin-top:12px">' + esc(sa.gateControl) + '</p></div>';

    out += '<div class="card-region"><h3>Key holder</h3>';
    out += '<p class="t-body prose">' + linkPhones(esc(sa.keyHolder.line)) + '</p>';
    out += '<p class="words">' + word(person(sa.keyHolder.person).consent) + '</p></div>';

    out += '<div class="card-region"><h3>Hours</h3>';
    out += '<p class="t-body prose">' + esc(sa.hours) + '</p></div>';

    out += '<div class="card-region"><h3>Receiving</h3>';
    out += '<p class="t-body prose">' + esc(sa.receiving) + '</p></div>';

    out += '<div class="card-region"><h3>Who was told</h3><ul>';
    sa.changeLog.slice().sort(function (a, b) { return a.when < b.when ? 1 : -1; }).forEach(function (l) {
      const told = l.told.map(nameOf).join(', ');
      out += '<li class="stack-row"><p class="t-body prose">' + esc(l.what + ' ' + dlong(l.when) + ', by ' + l.by + '. Told: ' + told + '.') + '</p></li>';
    });
    out += '</ul>';
    out += '<div class="actrow"><button type="button" class="act act--secondary" data-disc="told-band" aria-expanded="false" aria-controls="told-band"><span class="act-label">Log who was told</span></button></div>';
    out += '<div id="told-band" class="stack" hidden>';
    out += '<div class="field"><label class="t-head field-label" for="f-told">WHAT CHANGED AND WHO YOU TOLD</label>';
    out += '<textarea class="control" id="f-told" rows="3"></textarea></div>';
    out += '<div class="actrow"><button type="button" class="act"><span class="act-label">Save this note</span></button></div>';
    out += '</div></div>';
    return out;
  }

  /* ── Wiring ────────────────────────────────────────────────────────── */

  let pFocus = 'F-11';
  let coFocus = 'northgate';
  let addKind = FIXTURE.addSheet.kind;

  const RENDER = {
    'state-directory': renderDirectory,
    'state-person': function () { return renderPerson(pFocus); },
    'state-company': function () { return renderCompany(coFocus); },
    'state-roster': renderRoster,
    'state-pick': renderPick,
    'state-add': renderAdd,
    'state-access': renderAccess
  };

  function paint(s) {
    faceOf(s).innerHTML = RENDER[s]();
  }

  /* CR-5: narrow the call sheet to one role. */
  function narrowRoster(kind) {
    const sheet = faceOf('state-roster');
    const rows = sheet.querySelectorAll('[data-kind]');
    for (let i = 0; i < rows.length; i++) {
      rows[i].hidden = !(kind === 'Everyone' || rows[i].getAttribute('data-kind') === kind);
    }
    const bands = sheet.querySelectorAll('.band');
    for (let j = 0; j < bands.length; j++) {
      bands[j].hidden = bands[j].querySelectorAll('[data-kind]:not([hidden])').length === 0;
    }
  }

  function say(msg) {
    const el = document.getElementById('announce');
    if (el) { el.textContent = msg; }
  }

  function parseHash() {
    const raw = (location.hash || '').replace(/^#/, '');
    const tokens = raw.split(/[&,]/).filter(Boolean);
    let state = null;
    let nobar = false;
    for (let i = 0; i < tokens.length; i++) {
      if (state === null && tokens[i].indexOf('state-') === 0) { state = tokens[i]; }
      if (tokens[i] === 'nobar') { nobar = true; }
    }
    if (STATES.indexOf(state) < 0) { state = 'state-directory'; }
    return { state: state, nobar: nobar };
  }

  function show() {
    const h = parseHash();
    STATES.forEach(function (s) {
      faceOf(s).hidden = (s !== h.state);
    });
    document.getElementById('statebar').hidden = h.nobar;
    document.getElementById('head-count').hidden = (h.state !== 'state-directory');
    const bar = document.querySelectorAll('.sb-acts .act');
    for (let i = 0; i < bar.length; i++) {
      bar[i].setAttribute('aria-pressed', bar[i].getAttribute('data-go') === h.state ? 'true' : 'false');
    }
    say(STATE_NAMES[h.state]);
  }

  function boot() {
    document.getElementById('head-count').textContent = FIXTURE.head.people + ' people · ' + FIXTURE.head.firms + ' firms';
    STATES.forEach(paint);
    show();
  }

  document.addEventListener('click', function (ev) {
    const t = ev.target;
    if (!t || !t.closest) { return; }
    const op = t.closest('[data-open-person]');
    if (op) {
      ev.preventDefault();
      pFocus = op.getAttribute('data-open-person');
      paint('state-person');
      if (location.hash.replace(/^#/, '') === 'state-person') { show(); } else { location.hash = 'state-person'; }
      return;
    }
    const oc = t.closest('[data-open-company]');
    if (oc) {
      ev.preventDefault();
      coFocus = oc.getAttribute('data-open-company');
      paint('state-company');
      if (location.hash.replace(/^#/, '') === 'state-company') { show(); } else { location.hash = 'state-company'; }
      return;
    }
    const go = t.closest('[data-go]');
    if (go) {
      ev.preventDefault();
      if (go.closest('.sb-acts')) {
        pFocus = 'F-11';
        coFocus = 'northgate';
        addKind = FIXTURE.addSheet.kind;
        paint('state-person');
        paint('state-company');
        paint('state-add');
      }
      location.hash = go.getAttribute('data-go');
      return;
    }
    const disc = t.closest('[data-disc]');
    if (disc) {
      const panel = document.getElementById(disc.getAttribute('data-disc'));
      if (panel) {
        const open = disc.getAttribute('aria-expanded') === 'true';
        disc.setAttribute('aria-expanded', open ? 'false' : 'true');
        panel.hidden = open;
        say(open ? 'Folded' : 'Unfolded');
      }
      return;
    }
    const saveAuth = t.closest('.js-save-authority');
    if (saveAuth) {
      const box = document.getElementById('f-authority-edit');
      const line = document.getElementById('seat-authority');
      if (box && line) { line.innerHTML = plainWord(box.value); }
      const trigger = document.querySelector('[aria-controls="authority-band"]');
      if (trigger) { trigger.setAttribute('aria-expanded', 'false'); }
      const band = document.getElementById('authority-band');
      if (band) { band.hidden = true; }
      say('Authority saved.');
      return;
    }
    const confirmAuth = t.closest('.js-authority');
    if (confirmAuth) {
      const note = document.getElementById('authority-note');
      if (note) { note.textContent = 'Authority recorded for this seat.'; }
      say('Authority recorded.');
      return;
    }
    const putBack = t.closest('.js-putback');
    if (putBack) {
      const boxes = document.querySelectorAll('.pick-box');
      for (let i = 0; i < boxes.length; i++) { boxes[i].checked = false; }
      pickUpdate();
      say('Put back.');
      return;
    }
    const pressed = t.closest('[aria-pressed]');
    if (pressed && !pressed.getAttribute('data-go')) {
      const group = pressed.closest('[role="group"]');
      if (group && group.getAttribute('data-narrow') === 'add-kind') {
        const picked = pressed.getAttribute('data-kind-pick');
        addKind = picked;
        paint('state-add');
        say(picked);
        return;
      }
      if (group) {
        const all = group.querySelectorAll('[aria-pressed]');
        for (let i = 0; i < all.length; i++) { all[i].setAttribute('aria-pressed', 'false'); }
      }
      pressed.setAttribute('aria-pressed', 'true');
      if (group && group.getAttribute('data-narrow') === 'roster') { narrowRoster(pressed.getAttribute('data-kind-pick')); }
      say(pressed.textContent.trim());
    }
  });

  document.addEventListener('change', function (ev) {
    const t = ev.target;
    if (t && t.classList && t.classList.contains('pick-box')) {
      say(pickUpdate() + ' of 5 selected.');
    }
  });

  window.addEventListener('hashchange', show);

  window.addEventListener('message', function (ev) {
    const d = ev.data;
    if (!d || typeof d !== 'object') { return; }
    let s = d.state;
    if (typeof s !== 'string') { return; }
    if (s.indexOf('state-') !== 0) { s = 'state-' + s; }
    if (STATES.indexOf(s) < 0) { return; }
    location.hash = s;
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
}());
</script>
</body>
</html>
