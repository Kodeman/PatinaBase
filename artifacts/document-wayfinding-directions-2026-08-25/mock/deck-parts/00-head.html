<title>The Wayfinding Review</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   FONTS — inlined base64 (the CSP-proof path), then the mock kit and the two
   direction stylesheets, then the deck's own chrome (.dk-*).
   ========================================================================== */
/* @@FONTS@@ */
/* @@KIT@@ */
/* @@DIR_A@@ */
/* @@DIR_B@@ */

/* ==========================================================================
   THE DECK — tokens. The bare :root is the complete light palette; the two
   dark blocks redefine the same names and nothing else. Ground is a shade
   deeper than the product's own paper (#FCFAF6) so a mock plate reads as
   inset stock — depth by value contrast and a 1px rule, never a shadow (D4).
   ========================================================================== */
:root{
  --dk-ground:#F2EDE4;
  --dk-plate:#FCFAF6;
  --dk-ink:#241F1A;
  --dk-body:#4C4136;
  --dk-faint:#6C6053;
  --dk-hair:rgba(36,31,26,.15);
  --dk-hair-2:rgba(36,31,26,.30);
  --dk-hair-3:rgba(36,31,26,.62);
  --dk-oak:#6B5333;
  --dk-clay:#C4A57B;
  --dk-red:#95382B;
  --dk-red-wash:rgba(149,56,43,.09);
  --dk-amber:#7A5612;
  --dk-tint:rgba(36,31,26,.045);
  --dk-tint-2:rgba(36,31,26,.085);
  --dk-focus:#95382B;

  --dk-serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --dk-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --dk-mono:'DM Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --dk-rail:250px;
  --dk-measure:70ch;
  --dk-wide:1080px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --dk-ground:#15120F;
    --dk-plate:#211E1B;
    --dk-ink:#F1EBE0;
    --dk-body:#CDC1B3;
    --dk-faint:#A2968A;
    --dk-hair:rgba(241,235,224,.16);
    --dk-hair-2:rgba(241,235,224,.30);
    --dk-hair-3:rgba(241,235,224,.66);
    --dk-oak:#D4B78D;
    --dk-clay:#C4A57B;
    --dk-red:#E28A78;
    --dk-red-wash:rgba(226,138,120,.13);
    --dk-amber:#DCB765;
    --dk-tint:rgba(241,235,224,.05);
    --dk-tint-2:rgba(241,235,224,.095);
    --dk-focus:#E28A78;
  }
}
:root[data-theme="dark"]{
  --dk-ground:#15120F;
  --dk-plate:#211E1B;
  --dk-ink:#F1EBE0;
  --dk-body:#CDC1B3;
  --dk-faint:#A2968A;
  --dk-hair:rgba(241,235,224,.16);
  --dk-hair-2:rgba(241,235,224,.30);
  --dk-hair-3:rgba(241,235,224,.66);
  --dk-oak:#D4B78D;
  --dk-clay:#C4A57B;
  --dk-red:#E28A78;
  --dk-red-wash:rgba(226,138,120,.13);
  --dk-amber:#DCB765;
  --dk-tint:rgba(241,235,224,.05);
  --dk-tint-2:rgba(241,235,224,.095);
  --dk-focus:#E28A78;
}

/* ── Base ───────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto;} *{animation:none!important;transition:none!important;}}
body{
  margin:0;
  background:var(--dk-ground);
  color:var(--dk-body);
  font-family:var(--dk-sans);
  font-size:16.5px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;}
:focus-visible{outline:2px solid var(--dk-focus);outline-offset:3px;}
img{max-width:100%;display:block;}

/* ── The shell: a spine of index on the left, the paper on the right ────── */
.dk-shell{display:block;}
.dk-spine{
  position:fixed;left:0;top:0;bottom:0;width:var(--dk-rail);
  padding:30px 20px 30px 30px;
  border-right:1px solid var(--dk-hair);
  background:var(--dk-ground);
  overflow-y:auto;overflow-x:hidden;
  z-index:20;
}
.dk-spine-mark{
  margin:0 0 3px;font-family:var(--dk-serif);font-size:16px;font-weight:500;
  color:var(--dk-ink);letter-spacing:.005em;
}
.dk-spine-sub{
  margin:0 0 22px;font-family:var(--dk-mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.13em;color:var(--dk-faint);
}
.dk-spine-list{list-style:none;margin:0;padding:0;}
.dk-spine-list li{margin:0;}
.dk-spine-link{
  display:flex;gap:9px;align-items:baseline;
  padding:5px 0;text-decoration:none;
  font-family:var(--dk-mono);font-size:10.5px;line-height:1.45;
  letter-spacing:.075em;text-transform:uppercase;color:var(--dk-faint);
  border-bottom:1px solid transparent;
}
.dk-spine-link:hover{color:var(--dk-ink);}
.dk-spine-link .dk-tick{
  flex:0 0 14px;height:1px;margin-top:7px;background:var(--dk-hair-2);
}
.dk-spine-link[aria-current="true"]{color:var(--dk-ink);}
.dk-spine-link[aria-current="true"] .dk-tick{background:var(--dk-hair-3);height:2px;}
.dk-spine-foot{
  margin:24px 0 0;padding-top:14px;border-top:1px solid var(--dk-hair);
  font-family:var(--dk-mono);font-size:9px;line-height:1.7;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dk-faint);
}
.dk-theme{
  margin-top:14px;background:none;border:0;padding:0;cursor:pointer;
  font-family:var(--dk-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dk-faint);border-bottom:1px solid var(--dk-hair-2);
}
.dk-theme:hover{color:var(--dk-ink);border-bottom-color:var(--dk-hair-3);}

.dk-page{margin-left:var(--dk-rail);padding:0 48px 100px;}
.dk-main{max-width:var(--dk-wide);margin:0 auto;}

@media (max-width:1100px){
  .dk-spine{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--dk-hair);padding:26px 24px 20px;}
  .dk-spine-list{display:flex;flex-wrap:wrap;gap:0 18px;}
  .dk-spine-link .dk-tick{display:none;}
  .dk-page{margin-left:0;padding:0 24px 80px;}
}

/* ── Sections ───────────────────────────────────────────────────────────── */
.dk-sec{padding:64px 0 8px;}
.dk-sec > .dk-rule-break{margin:0 0 34px;}
.dk-rule-break{border:0;border-top:1px solid var(--dk-hair-3);height:0;}
.dk-eyebrow{
  margin:0 0 14px;font-family:var(--dk-mono);font-size:10px;font-weight:500;
  letter-spacing:.19em;text-transform:uppercase;color:var(--dk-oak);
}
h1,h2,h3,h4{font-family:var(--dk-serif);color:var(--dk-ink);text-wrap:balance;font-weight:500;}
h2{font-size:clamp(28px,3.4vw,42px);line-height:1.14;letter-spacing:-.012em;margin:0 0 22px;}
h3{font-size:22px;line-height:1.24;margin:44px 0 12px;font-weight:500;}
h4{font-size:16.5px;line-height:1.3;margin:30px 0 8px;font-weight:600;font-family:var(--dk-sans);color:var(--dk-ink);}
p{margin:0 0 18px;max-width:var(--dk-measure);}
.dk-lede{font-size:19.5px;line-height:1.55;color:var(--dk-ink);max-width:64ch;}
.dk-lede em{font-style:italic;}
.dk-note{font-size:14.5px;color:var(--dk-faint);max-width:76ch;}
ul,ol{max-width:var(--dk-measure);margin:0 0 18px;padding-left:20px;}
li{margin:0 0 8px;}
strong{color:var(--dk-ink);font-weight:600;}
em{font-style:italic;}
.dk-quote{
  margin:0 0 18px;padding:2px 0 2px 18px;border-left:2px solid var(--dk-hair-2);
  font-style:italic;color:var(--dk-ink);max-width:64ch;
}
.dk-chip{
  font-family:var(--dk-mono);font-size:12px;letter-spacing:.02em;
  background:var(--dk-tint);padding:1px 5px;color:var(--dk-ink);white-space:nowrap;
}
.dk-src{
  font-family:var(--dk-mono);font-size:11px;letter-spacing:.02em;color:var(--dk-faint);
  word-break:break-word;
}
.dk-endmark{
  margin:56px 0 0;padding-top:16px;border-top:1px solid var(--dk-hair);
  font-family:var(--dk-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dk-faint);max-width:none;
}

/* ── Cover ──────────────────────────────────────────────────────────────── */
.dk-cover{padding:74px 0 8px;}
.dk-cover h1{
  font-size:clamp(46px,7.2vw,88px);line-height:.98;letter-spacing:-.022em;margin:0 0 20px;
  font-weight:500;
}
.dk-cover h1 em{font-style:italic;}
.dk-cover-thesis{
  font-family:var(--dk-serif);font-size:clamp(19px,2.3vw,26px);line-height:1.4;
  color:var(--dk-ink);max-width:30ch;margin:0 0 34px;
}
.dk-cover-meta{
  display:flex;flex-wrap:wrap;gap:6px 26px;margin:0 0 40px;padding:14px 0;
  border-top:1px solid var(--dk-hair-3);border-bottom:1px solid var(--dk-hair);
  font-family:var(--dk-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dk-faint);
}
.dk-cover-meta span{white-space:nowrap;}
.dk-sha{text-transform:none;letter-spacing:.02em;}
.dk-rulings{
  display:grid;gap:0;margin:0 0 40px;max-width:900px;
  border-top:1px solid var(--dk-hair);
}
.dk-ruling{
  display:grid;grid-template-columns:112px 1fr;gap:20px;
  padding:14px 0;border-bottom:1px solid var(--dk-hair);
}
.dk-ruling dt{
  font-family:var(--dk-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dk-oak);padding-top:3px;
}
.dk-ruling dd{margin:0;font-size:15.5px;line-height:1.55;color:var(--dk-ink);}
.dk-contents{margin:44px 0 0;padding-top:22px;border-top:1px solid var(--dk-hair-3);}
.dk-contents ol{list-style:none;margin:0;padding:0;max-width:none;
  columns:2;column-gap:56px;}
.dk-contents li{margin:0 0 7px;break-inside:avoid;}
.dk-contents a{
  font-family:var(--dk-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dk-body);text-decoration:none;border-bottom:1px solid transparent;
}
.dk-contents a:hover{color:var(--dk-ink);border-bottom-color:var(--dk-hair-2);}
@media (max-width:760px){.dk-contents ol{columns:1;}}

/* ── Tables ─────────────────────────────────────────────────────────────── */
.dk-scroll{overflow-x:auto;margin:0 0 26px;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45;}
th,td{text-align:left;padding:9px 14px 9px 0;border-bottom:1px solid var(--dk-hair);vertical-align:top;}
th{
  font-family:var(--dk-mono);font-size:9.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dk-faint);border-bottom:1px solid var(--dk-hair-3);
  padding-bottom:7px;white-space:nowrap;
}
td strong{font-weight:600;}
.dk-num{font-variant-numeric:tabular-nums;white-space:nowrap;}
.dk-t-mono td:first-child,.dk-mono-cell{font-family:var(--dk-mono);font-size:12px;letter-spacing:.02em;}
tr.dk-worst td{background:var(--dk-tint);}
caption{caption-side:bottom;text-align:left;padding-top:10px;font-family:var(--dk-mono);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dk-faint);}

/* ── The findings register ──────────────────────────────────────────────── */
.dk-theme-head{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  margin:52px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--dk-hair-3);
}
.dk-theme-head h3{margin:0;font-size:24px;}
.dk-theme-head .dk-count{
  font-family:var(--dk-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dk-faint);
}
.dk-find{
  padding:22px 0 20px 20px;border-bottom:1px solid var(--dk-hair);
  border-left:3px solid var(--dk-hair);
}
.dk-find[data-sev="blocker"]{border-left-color:var(--dk-red);}
.dk-find[data-sev="high"]{border-left-color:var(--dk-clay);}
.dk-find-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin:0 0 8px;}
.dk-id{
  font-family:var(--dk-mono);font-size:11px;font-weight:500;letter-spacing:.1em;
  color:var(--dk-ink);
}
.dk-sev{
  font-family:var(--dk-mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  padding:2px 6px;color:var(--dk-faint);border:1px solid var(--dk-hair-2);
}
.dk-find[data-sev="blocker"] .dk-sev{color:var(--dk-red);border-color:var(--dk-red);}
.dk-find[data-sev="high"] .dk-sev{color:var(--dk-amber);border-color:var(--dk-hair-2);}
.dk-seats{
  font-family:var(--dk-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dk-faint);
}
.dk-canon{
  font-family:var(--dk-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dk-oak);
}
.dk-find h4{margin:0 0 10px;font-family:var(--dk-serif);font-size:20.5px;font-weight:500;
  line-height:1.24;color:var(--dk-ink);}
.dk-obs{
  margin:0 0 12px;padding:12px 16px;background:var(--dk-tint);
  font-size:14.5px;line-height:1.6;color:var(--dk-body);max-width:78ch;
}
.dk-obs code,.dk-code{
  font-family:var(--dk-mono);font-size:.9em;color:var(--dk-ink);
  background:var(--dk-tint-2);padding:0 3px;
}
.dk-credit{
  margin:0 0 12px;font-size:14px;line-height:1.55;color:var(--dk-faint);max-width:78ch;
}
.dk-credit b{color:var(--dk-ink);font-weight:600;}
.dk-refs{margin:0;font-family:var(--dk-mono);font-size:10.5px;letter-spacing:.02em;
  color:var(--dk-faint);max-width:none;overflow-wrap:anywhere;}
.dk-refs span{white-space:nowrap;}
/* Narrow widths: a citation longer than the viewport must wrap rather than push
   the document sideways. (QA B1 — six spans reached 405px against a 390px page.) */
@media (max-width:760px){
  .dk-refs span{white-space:normal;overflow-wrap:anywhere;word-break:break-word;}
}

/* ── Plates: an embedded screenshot, framed by one rule ─────────────────── */
.dk-plate{margin:16px 0 6px;max-width:100%;}
.dk-plate img{
  width:100%;height:auto;border:1px solid var(--dk-hair-2);background:var(--dk-plate);
}
.dk-plate figcaption,.dk-cap{
  margin:8px 0 0;font-family:var(--dk-mono);font-size:10px;line-height:1.65;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dk-faint);
}
.dk-plate figcaption b,.dk-cap b{color:var(--dk-ink);font-weight:500;}
.dk-plates-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:16px 0 6px;}
@media (max-width:860px){.dk-plates-2{grid-template-columns:1fr;}}
.dk-plate-narrow{max-width:400px;}

/* ── Mock frames (the CSS-built directions) ─────────────────────────────── */
.dk-mock{margin:26px 0 10px;max-width:100%;}
.dk-mock-viewport{
  position:relative;overflow:hidden;border:1px solid var(--dk-hair-2);
  background:var(--dk-plate);box-sizing:content-box;max-width:100%;
}
.dk-mock-scale{transform-origin:top left;}
.dk-mock-scale > .mock-frame{
  display:block;border:0;border-radius:0;overflow:visible;background:transparent;
  margin:0;vertical-align:top;
}
.dk-mock-cap{
  margin:9px 0 0;font-family:var(--dk-mono);font-size:10.5px;line-height:1.7;
  letter-spacing:.07em;text-transform:uppercase;color:var(--dk-faint);max-width:none;
}
.dk-mock-cap b{color:var(--dk-ink);font-weight:500;}
.dk-mock-cap i{font-style:normal;color:var(--dk-oak);}

/* ── Two-up compare ─────────────────────────────────────────────────────── */
.dk-two{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin:0 0 12px;}
.dk-two > div > p,.dk-two > div > ul{max-width:none;}
@media (max-width:900px){.dk-two{grid-template-columns:1fr;gap:26px;}}
.dk-col-head{
  margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--dk-hair-3);
  font-family:var(--dk-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dk-ink);
}

/* ── Ledger blocks (Keeps / Refuses / Costs, amendments) ────────────────── */
.dk-ledger{margin:0 0 26px;border-top:1px solid var(--dk-hair-3);}
.dk-ledger-row{
  display:grid;grid-template-columns:132px 1fr;gap:22px;
  padding:14px 0;border-bottom:1px solid var(--dk-hair);
}
.dk-ledger-row > dt{
  font-family:var(--dk-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dk-oak);padding-top:3px;
}
.dk-ledger-row > dd{margin:0;font-size:15px;line-height:1.6;}
@media (max-width:640px){.dk-ledger-row{grid-template-columns:1fr;gap:6px;}}
.dk-amend{
  margin:0 0 22px;padding:20px 22px;background:var(--dk-tint);
  border-left:3px solid var(--dk-clay);
}
.dk-amend > *:last-child{margin-bottom:0;}
.dk-amend h4{margin-top:0;}
.dk-callout{
  margin:26px 0;padding:20px 22px;border-top:1px solid var(--dk-hair-3);
  border-bottom:1px solid var(--dk-hair-3);background:var(--dk-tint);
}
.dk-callout > *:last-child{margin-bottom:0;}
.dk-callout p{max-width:74ch;}

/* ── Voices ─────────────────────────────────────────────────────────────── */
.dk-voice{
  padding:26px 0 22px;border-bottom:1px solid var(--dk-hair);
}
.dk-voice-who{
  margin:0 0 12px;font-family:var(--dk-mono);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dk-oak);
}
.dk-voice-who b{color:var(--dk-ink);font-weight:500;}
.dk-voice blockquote{
  margin:0 0 12px;font-family:var(--dk-serif);font-size:22px;line-height:1.4;
  font-style:italic;color:var(--dk-ink);max-width:44ch;
}
.dk-voice blockquote::before{content:"\201C";}
.dk-voice blockquote::after{content:"\201D";}
.dk-voice .dk-voice-tail{margin:0;font-size:14.5px;color:var(--dk-faint);max-width:74ch;}

/* ── Score grid ─────────────────────────────────────────────────────────── */
.dk-scores{min-width:880px;}
.dk-scores th:first-child,.dk-scores tbody th,.dk-scores tfoot th{width:22%;padding-right:20px;}
.dk-scores td.dk-score{
  font-family:var(--dk-mono);font-size:19px;font-weight:500;color:var(--dk-ink);
  font-variant-numeric:tabular-nums;padding-right:22px;width:39%;
}
.dk-scores td.dk-score > span:not(.dk-why){
  display:block;font-size:10px;font-weight:400;letter-spacing:.1em;color:var(--dk-faint);
  text-transform:uppercase;margin-top:2px;
}
.dk-scores td .dk-why{
  display:block;margin:5px 0 16px;font-family:var(--dk-sans);font-size:13px;line-height:1.5;
  font-weight:400;letter-spacing:normal;text-transform:none;white-space:normal;color:var(--dk-faint);
}
.dk-scores td .dk-why:last-child{margin-bottom:0;}
.dk-scores td .dk-why code{font-size:.92em;}
.dk-scores tbody th,.dk-scores tfoot th{
  font-family:var(--dk-sans);font-size:13.5px;font-weight:600;text-transform:none;
  letter-spacing:0;color:var(--dk-ink);white-space:normal;border-bottom:1px solid var(--dk-hair);
  vertical-align:top;padding-top:9px;
}
.dk-scores tfoot th,.dk-scores tfoot td{border-bottom:0;border-top:1px solid var(--dk-hair-3);padding-top:14px;}

/* ── Questions ──────────────────────────────────────────────────────────── */
.dk-q{padding:24px 0 20px;border-bottom:1px solid var(--dk-hair);}
.dk-q-n{
  font-family:var(--dk-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dk-oak);margin:0 0 6px;
}
.dk-q h4{margin:0 0 10px;font-family:var(--dk-serif);font-size:21px;font-weight:500;line-height:1.25;}
.dk-q p{max-width:78ch;}
.dk-q p:last-child{margin-bottom:0;}
.dk-ask{
  display:inline-block;margin-top:4px;
  font-family:var(--dk-mono);font-size:11px;line-height:1.7;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dk-ink);
  border-bottom:1px solid var(--dk-hair-3);padding-bottom:2px;
}

/* ── Colophon ───────────────────────────────────────────────────────────── */
.dk-files{font-size:14px;}
.dk-files td:first-child{font-family:var(--dk-mono);font-size:11.5px;white-space:nowrap;
  padding-right:24px;color:var(--dk-ink);}
</style>
