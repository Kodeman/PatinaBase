Specified,” 0 of 1 installed, and “Bill 1 uninvoiced.” A checklist toggle was enough to claim final payment collected.",impact:"Projects can be marked complete with unfinished work and unbilled revenue, corrupting operations and financial reporting.",fix:"Derive closeout gates from source-of-truth states: all install lines complete or waived, zero uninvoiced lines, zero outstanding balance, and explicit exception reasons."},{id:"F03",severity:"high",title:"Client association is dropped when Direction begins",moment:"Discovery → Direction",evidence:"The accepted lead became a Direction document labeled “No client linked — attach one.” The client had to be selected again and invited before the proposal could be sent.",impact:"A designer can draft against an orphaned document or link the wrong household, breaking the lead-to-client chain.",fix:"Carry the canonical client/person ID atomically through every document transition; treat a missing relationship as a transition failure, not a repair task."},{id:"F04",severity:"high",title:"An unrelated project timer follows the user into this project",moment:"Active project and Care",evidence:"A persistent bottom tray offered to log 32 minutes to “Ashford Heights — main floor refresh” throughout the Harper Vale project and closeout.",impact:"Time can be billed to the wrong client, and the overlay competes with the active project’s controls.",fix:"Scope the timer to its owning document, require an explicit project switch, and collapse stale timers into a neutral global notification."},{id:"F05",severity:"high",title:"Dates shift across local and generated records",moment:"Signature → Project",evidence:"On Jul 31 in America/Chicago, “Mark signed” defaulted to Aug 1. After correcting the signature to Jul 31, the project still opened with Start = Aug 1. Install was Nov 14 against a Nov 15 hard date.",impact:"Off-by-one dates weaken legal records, schedules, reporting, and client expectations.",fix:"Store date-only values as DATE,
