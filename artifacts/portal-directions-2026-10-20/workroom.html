<header class="masthead"><div class="identity"><a class="wordmark" href="index.html#workroom" aria-label="Patina presentation">patina</a><div class="product-name">Workroom<span class="studio">Middle West Studio</span></div></div><div class="role-switch" role="group" aria-label="Preview portal role"><button type="button" data-role="designer" aria-pressed="true">Designer</button><button type="button" data-role="client" aria-pressed="false">Client</button><button type="button" data-role="maker" aria-pressed="false">Maker</button></div></header>
<main id="main"></main>
<footer class="prototype-note"><span>Fictional project and maker. Images illustrate a direction; they are not product specifications.</span><span>Patina / Workroom concept / October 2026</span></footer>
<dialog class="dialog" id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="dialog-close" aria-label="Close dialog">×</button></div><div class="dialog-body" id="dialog-body"></div></dialog>
<div class="toast" role="status" aria-live="polite" id="toast"></div>
<script>
(()=>{
const arrow='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
const ruler='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v8H4zM8 8v4m4-4v3m4-3v4"/></svg>';
const plan='<div class="plan-thumb"><svg viewBox="0 0 120 76" role="img" aria-label="Illustrative living room floor plan"><g fill="none" stroke="currentColor" stroke-width="1.1"><path d="M8 8h104v60H8zM8 25v27M50 8h28"/><path d="M12 10h33v13H12zm65 39h22v16H77zM50 30h24v15H50z"/><path d="M8 52h18v16M26 52a18 18 0 0 1-18 18" stroke-dasharray="2 2"/><path d="M14 5h25M82 5h24" stroke-width="3"/><circle cx="90" cy="31" r="10"/><path d="M86 24l10 11"/></g><circle cx="90" cy="31" r="3" fill="currentColor"/></svg></div>';
let role='designer', item='chair', finish='natural', savedFinish='', savedFinishes={designer:'',client:''}, draftSaved=false, drafts={}, toastTimer;
try{const saved=JSON.parse(localStorage.getItem('patina-workroom-demo')||'{}');for(const r of ['designer','client'])savedFinishes[r]=['natural','smoked'].includes(saved.preferences?.[r])?saved.preferences[r]:'';savedFinish=savedFinishes.designer;finish=savedFinish||'natural';drafts=saved.drafts&&typeof saved.drafts==='object'?saved.drafts:{};draftSaved=Boolean(drafts[role])}catch(e){}
const main=document.getElementById('main'),dialog=document.getElementById('dialog');
const finishName=()=>finish==='natural'?'Natural oak':finish==='smoked'?'Smoked oak':'Not selected';
function persist(){try{localStorage.setItem('patina-workroom-demo',JSON.stringify({preferences:savedFinishes,drafts}))}catch(e){}}
function announce(message){const toast=document.getElementById('toast');toast.textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.textContent=''},5000)}
function finishButtons(){return `<fieldset class="sample-group"><legend>${role==='client'?'Which finish feels right?':'Finish sample'}</legend><div class="finish-options"><button type="button" class="finish-option" data-finish="natural" aria-pressed="${finish==='natural'}"><span class="finish-mini" aria-hidden="true"></span>Natural<br>oak</button><button type="button" class="finish-option" data-finish="smoked" aria-pressed="${finish==='smoked'}"><span class="finish-mini smoked" aria-hidden="true"></span>Smoked<br>oak</button></div><p class="choice-note">${role==='client'?'Leah recommends natural oak for its lighter grain.':'Natural oak is Leah’s recommendation.'} Physical sample review comes before the order.</p></fieldset>`}
function board(){return `<div class="canvas">${role==='designer'?'<div class="board-note"><strong>Room composition</strong>Select a piece to see its details.</div>':''}<figure class="room-photo"><img src="assets/room.jpg" alt="An airy living room with natural textures and light wood"><figcaption>Living room direction</figcaption></figure><button type="button" class="chair-piece" data-item="chair" aria-label="Inspect white-oak lounge chair" ${role==='client'?'aria-haspopup="dialog"':'aria-pressed="'+(item==='chair')+'"'}><img src="assets/chair.jpg" alt="Illustrative timber lounge chair with natural upholstery"><span class="object-id">LR–01 / Lounge chair</span>${item==='chair'?'<i class="selection-dot one"></i><i class="selection-dot two"></i><i class="selection-dot three"></i><i class="selection-dot four"></i>':''}</button><div class="chair-label">White-oak lounge chair<span>Northline Workshop / Example maker</span></div><button type="button" class="material-piece" data-item="material" aria-label="Inspect natural linen material" ${role==='client'?'aria-haspopup="dialog"':'aria-pressed="'+(item==='material')+'"'}><img src="assets/detail.jpg" alt="Rear detail of the illustrative lounge chair showing its oak frame and natural upholstery"></button><div class="material-caption"><strong>Natural linen</strong>A little texture.<br>Nothing too precious.</div><div class="board-swatches"><button type="button" class="sample" data-finish="natural" aria-label="Select natural oak finish" aria-pressed="${finish==='natural'}"></button><button type="button" class="sample smoked" data-finish="smoked" aria-label="Select smoked oak finish" aria-pressed="${finish==='smoked'}"></button><p>Two finishes.<br>One decision.</p></div></div>`}
function designerInspector(){return `<aside class="inspector" aria-label="Selected piece details"><div class="inspector-kicker"><span>Selected ${item==='chair'?'piece':'material'}</span><span>${item==='chair'?'LR–01':'LR–01 / Upholstery'}</span></div><div class="inspector-main"><h2>${item==='chair'?'White-oak<br>lounge chair':'Natural<br>linen'}</h2><p class="maker-name">${item==='chair'?'Northline Workshop':'Upholstery for the lounge chair'}</p><p class="description">${item==='chair'?'An open oak frame, a generous seat, and linen that lets the grain do the talking.':'A soft, open weave with enough texture to sit comfortably beside the oak frame.'}</p><ul class="spec-list"><li><span>${item==='chair'?'Dimensions':'Composition'}</span><strong>${item==='chair'?'30″ W × 32″ D × 31″ H':'Linen / Sample pending'}</strong></li><li><span>${item==='chair'?'Upholstery':'Color'}</span><strong>Natural linen</strong></li><li><span>Room / Placement</span><strong>Living / Window corner</strong></li></ul><button type="button" class="text-button" data-action="dimensions">${ruler} View room & dimensions</button></div><div class="inspector-actions">${finishButtons()}<button type="button" class="primary-button" data-action="save">Save sample selection ${arrow}</button><button type="button" class="secondary-button" data-action="draft">${draftSaved?'Open saved draft':'Draft note to Nora'}</button><p class="inspector-footnote">Client decision still needed before release to the workshop. Notes remain drafts until Leah sends them.</p></div></aside>`}
function clientInspector(){return `<aside class="inspector" aria-label="Your finish decision"><div class="inspector-kicker"><span>For Nora Ellis</span><span>One choice to make</span></div><div class="inspector-main"><h2>The last detail.<br>The oak finish.</h2><blockquote class="quote-rule"><p>“I’d keep the oak natural. It picks up the light from the lake and feels right beside the linen.”</p><cite>Leah / Your designer</cite></blockquote><p class="description">Your chair’s shape and upholstery are agreed. Tell Leah which finish you prefer, then look at the physical sample together.</p><button type="button" class="text-button" data-action="dimensions">${ruler} See how the chair fits</button></div><div class="inspector-actions">${finishButtons()}<button type="button" class="primary-button" data-action="save" ${!finish?'disabled':''}>Save my preference ${arrow}</button><button type="button" class="secondary-button" data-action="draft">Draft a question for Leah</button><p class="inspector-footnote">This preview saves on this device only. Your selection does not place an order or send a message.</p></div></aside>`}
function makerInspector(){return `<aside class="inspector" aria-label="Workshop specification"><div class="inspector-kicker"><span>For Northline Workshop</span><span>Specification / Rev. 03</span></div><div class="inspector-main"><h2>One chair.<br>Every detail.</h2><p class="maker-name">Prepared by Leah / Middle West Studio</p><ul class="spec-list"><li><span>Piece</span><strong>LR–01 Lounge chair</strong></li><li><span>Quantity</span><strong>1</strong></li><li><span>Frame</span><strong>White oak</strong></li><li><span>Upholstery</span><strong>Natural linen</strong></li><li><span>Finish</span><strong>Client decision pending</strong></li><li><span>Target install</span><strong>November 18, 2026</strong></li></ul></div><div class="inspector-actions"><div class="maker-stage"><p>Hold for finish approval.</p><small>The studio will release the final specification after Nora reviews the physical oak sample. This is not a production order.</small></div><button type="button" class="primary-button" data-action="dimensions">Open dimension sheet ${arrow}</button><button type="button" class="secondary-button" data-action="draft">Draft a clarification</button><p class="inspector-footnote">Illustrative dimensions for this concept. Confirm final dimensions and lead time with the studio.</p></div></aside>`}
function record(){const selected=savedFinish==='natural'?'Natural oak':'Smoked oak';return `<section class="record" aria-label="Project decision record"><div><h2>The room record</h2><p class="record-label">What we know, together.</p></div><div class="record-body"><div class="record-icon" aria-hidden="true">${savedFinish?'✓':'↳'}</div><p><strong>${savedFinish?selected+(role==='designer'?' studio preference saved.':' client preference saved.'):'Chair silhouette and natural linen agreed.'}</strong><br>${savedFinish?'Saved in this local concept. Physical sample review and final approval remain open.':(role==='maker'?'The finish remains with the studio until Leah releases the specification.':'The oak finish is the remaining choice. Leah recommends natural oak.')}<small>${savedFinish?'Preview activity / This device only':'October 19, 2026 / Leah & Nora / Fictional decision record'}</small></p></div><div class="next-action">Next in the room<strong>${role==='maker'?'Wait for the studio’s approved specification.':savedFinish?'Review the physical sample with Leah.':'Choose an oak sample to review.'}</strong>${draftSaved?'<span style="display:block;margin-top:7px">A note is saved as a local draft.</span>':''}</div></section>`}
function render(){document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===role)));const identity=role==='designer'?'Leah':role==='client'?'Nora':'Northline';main.innerHTML=`<div class="project-heading"><div><p class="breadcrumb">${role==='maker'?'Middle West Studio / Workshop specification':'Middle West Studio / Active project'}</p><h1>Lake Mendota House</h1></div><div class="project-details"><div><span>Location</span><strong>Madison, Wisconsin</strong></div><div><span>Target install</span><strong>November 18, 2026</strong></div><div class="avatar" title="${identity}">${role==='designer'?'LK':role==='client'?'NE':'NW'}</div></div></div><div class="workspace ${role}"><section class="work-surface" aria-label="Living room composition"><div class="surface-heading"><div><h2>Living room</h2><p>${role==='maker'?'Build specification':'A place to gather'}</p></div><div class="view-label"><span>${role==='maker'?'Drawing for discussion':'Composition / Rev. 03'}</span><button type="button" class="text-button" data-action="dimensions">${ruler} ${role==='maker'?'Dimensions':'Room plan'}</button></div></div>${role==='client'?'<div class="client-intro"><h2>A room with room<br>to breathe.</h2><p>The pieces we’ve chosen together, with one small decision<br class="wide-break"> left before your chair goes to the workshop.</p></div>':''}${role==='maker'?`<div class="maker-canvas"><div class="drawing-label"><strong>LR–01 / White-oak lounge chair</strong>Illustrative study / Not to scale</div><img class="maker-object" src="assets/chair.jpg" alt="Illustrative white oak lounge chair for workshop discussion"><div class="dimension-line horizontal">30″ / Overall width</div><div class="dimension-line vertical">31″<br>Overall<br>height</div></div><div class="technical-strip"><p>Frame<strong>Solid white oak</strong>Finish pending</p><p>Upholstery<strong>Natural linen</strong>Physical sample to confirm</p><p>Overall depth<strong>32 inches</strong>Illustrative dimensions</p></div>`:board()}<div class="surface-footer">${plan}<p class="footer-note">${role==='maker'?'Window corner / Living room':'Keep the view open. Let the materials carry the room.'}<span>${role==='maker'?'The final room fit is confirmed by the studio.':'Leah’s direction / Shared with Nora'}</span></p></div></section>${role==='maker'?makerInspector():role==='client'?clientInspector():designerInspector()}</div>${record()}`}
function showDimensions(){document.getElementById('dialog-title').textContent='A little room around the chair';document.getElementById('dialog-body').innerHTML=`<div class="dimension-illustration"><svg viewBox="0 0 430 230" role="img" aria-label="Illustrative floor plan showing a lounge chair by the window and a walking route"><g stroke="currentColor" fill="none" stroke-width="1.5"><path d="M55 25h320v165H55zM120 25h100"/><path d="M65 40h110v40H65zm175 25h67v67h-67zM190 105h43v37h-43z"/><path d="M240 65h67v15h-67M240 120h67M250 80v40m47-40v40"/><path d="M60 190h50v-42M110 148a50 50 0 0 0-50 42" stroke-dasharray="3 3"/><path d="M62 17h105M240 17h65" stroke-width="5"/><path d="M233 155h80m-80-5v10m80-10v10M325 65v67m-5-67h10m-10 67h10"/><path d="M150 170h170" stroke-dasharray="4 4"/></g><g fill="currentColor" font-family="Arial, sans-serif" font-size="10"><text x="258" y="173">30″ wide</text><text x="335" y="102">32″ deep</text><text x="155" y="211">Illustrative living room / Not to scale</text></g></svg></div><ul class="spec-list"><li><span>Overall chair size</span><strong>30″ W × 32″ D × 31″ H</strong></li><li><span>Placement</span><strong>Living room / Window corner</strong></li><li><span>Upholstery</span><strong>Natural linen</strong></li><li><span>Frame finish</span><strong>${role==='maker'?'Awaiting studio release':finishName()+' / Sample review pending'}</strong></li></ul><p>These are sample dimensions for this prototype. Leah and the workshop confirm the final piece and room fit before production.</p><button type="button" class="primary-button" data-action="close-dialog">Back to the room</button>`;dialog.showModal()}
function showMaterial(){document.getElementById('dialog-title').textContent='Natural linen';document.getElementById('dialog-body').innerHTML='<p>A soft, open weave with enough texture to sit comfortably beside the oak frame. The chair image is a visual reference for this direction.</p><ul class="spec-list"><li><span>Piece</span><strong>LR–01 Lounge chair</strong></li><li><span>Upholstery direction</span><strong>Natural linen</strong></li><li><span>Next step</span><strong>Review the physical sample</strong></li></ul><p>Leah and the workshop will confirm the final textile, composition, and care details before production.</p><button type="button" class="primary-button" data-action="close-dialog">Back to the room</button>';dialog.showModal()}
function showDraft(){const client=role==='client',maker=role==='maker';document.getElementById('dialog-title').textContent=client?'A question for Leah':maker?'Clarify the specification':'A note for Nora';const draft=client?(finish?'Hi Leah, I’m leaning toward '+finishName().toLowerCase()+'. Could we look at the physical sample in the room before deciding?':'Hi Leah, could we compare both physical oak samples in the room before deciding?'):maker?'Hi Leah, we have the lounge chair specification. Please confirm the final oak finish after the client’s sample review, along with the approved dimensions and installation timing.':'Hi Nora, the lounge chair’s shape and natural linen are agreed. I recommend natural oak to keep the room light. Let’s compare the natural and smoked oak samples together before we release the piece to Northline Workshop.';document.getElementById('dialog-body').innerHTML=`<p>${client?'Keep your question with the room.':maker?'Keep the open questions attached to the piece.':'The finish request stays with this room and its decision record.'}</p><label for="draft-text">${client?'To Leah':maker?'To Leah / Middle West Studio':'To Nora Ellis'} / Draft</label><textarea id="draft-text"></textarea><button type="button" class="primary-button" data-action="save-draft">Save draft</button><p class="inspector-footnote" style="margin-top:13px">Saved locally for this concept. Nothing is sent to a client or workshop.</p>`;document.getElementById('draft-text').value=drafts[role]||draft;dialog.showModal()}
document.addEventListener('click',e=>{const roleButton=e.target.closest('[data-role]');if(roleButton){role=roleButton.dataset.role;item='chair';savedFinish=savedFinishes[role]||'';finish=savedFinish||(role==='designer'?'natural':'');draftSaved=Boolean(drafts[role]);render();return}const finishButton=e.target.closest('[data-finish]');if(finishButton){const marker=finishButton.classList.contains('sample')?'sample':'finish-option';finish=finishButton.dataset.finish;render();const replacement=main.querySelector('.'+marker+'[data-finish="'+finish+'"]');replacement?.focus({preventScroll:true});announce(finishName()+' selected. Save to add it to the room record.');return}const itemButton=e.target.closest('[data-item]');if(itemButton){item=itemButton.dataset.item;if(role==='client'){item==='chair'?showDimensions():showMaterial();return}render();main.querySelector('[data-item="'+item+'"]')?.focus({preventScroll:true});announce(item==='chair'?'Lounge chair details shown.':'Natural linen details shown.');return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='dimensions')showDimensions();if(action==='draft')showDraft();if(action==='close-dialog')dialog.close();if(action==='save'){savedFinish=finish;savedFinishes[role]=finish;persist();render();main.querySelector('[data-action="save"]')?.focus({preventScroll:true});announce(finishName()+' preference saved on this device. No order placed.')}if(action==='save-draft'){drafts[role]=document.getElementById('draft-text').value;draftSaved=true;persist();dialog.close();render();main.querySelector('[data-action="draft"]')?.focus({preventScroll:true});announce('Draft saved locally. No message sent.')}});
document.querySelector('.dialog-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});render();
})();
</script>
</body>
</html>
