<!doctype html>
<html lang="en" data-channel="{{channel}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=816, initial-scale=1">
<title>{{title}}</title>
<!-- Patina one-pager (one-pager-letter, 8.5x11 in). Margins 0.75 in; eyebrow, Playfair title, one
     image band, sections in a single column, CTA at the foot. Print-safe: paper ground, no dark
     full bleed. Filled by marketing/tools/compose.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @page { size: letter; margin: 0; }
  :root{
    --paper:#EDE9E4;      /* patinaOffWhite */
    --clay:#A3927C;       /* clayBeige */
    --rule:#B8B0A6;       /* mediumGray */
    --mocha:#655B52;      /* mochaBrown */
    --body:#4A453F;       /* darkGray */
    --ink:#3F3B37;        /* charcoal */
    --font-display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono:'DM Mono', 'SF Mono', Menlo, monospace;
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; background:var(--paper); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .page{
    width:8.5in; height:11in; overflow:hidden; padding:0.75in;
    display:flex; flex-direction:column;
    background:var(--paper); color:var(--body); font-family:var(--font-body); font-size:10.5pt; line-height:1.55;
  }
  .eyebrow{
    font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.18em; color:var(--clay);
    font-size:8pt; display:flex; align-items:center; gap:0.7em; margin:0 0 0.18in;
  }
  .eyebrow::before{ content:''; display:inline-block; width:1.4em; height:1px; background:var(--clay); }
  h1{ font-family:var(--font-display); font-weight:400; font-size:30pt; line-height:1.12; color:var(--ink); margin:0 0 0.3in; text-wrap:balance; max-width:6in; }
  .media{ height:3.1in; overflow:hidden; background:var(--clay); margin-bottom:0.34in; }
  .image{ display:block; width:100%; height:100%; object-fit:cover; }
  .image-pending{ display:flex; align-items:center; justify-content:center; background:var(--clay); }
  .image-pending span{ font-family:var(--font-mono); letter-spacing:0.2em; color:var(--paper); font-size:9pt; }
  .section{ border-top:1px solid var(--rule); padding:0.14in 0 0.16in; display:grid; grid-template-columns:1.9in 1fr; gap:0.3in; }
  .section h2{ font-family:var(--font-display); font-weight:400; font-size:13pt; line-height:1.3; color:var(--ink); margin:0; }
  .section p{ margin:0 0 0.6em; }
  .section p:last-child{ margin-bottom:0; }
  .section ul{ margin:0; padding-left:1.1em; }
  .foot{ margin-top:auto; border-top:1px solid var(--rule); padding-top:0.18in; display:flex; justify-content:space-between; align-items:baseline; }
  .cta{ font-family:var(--font-display); font-style:italic; font-size:14pt; color:var(--ink); margin:0; }
  .wordmark-type{ font-family:var(--font-display); font-size:14pt; color:var(--mocha); }
  .wordmark-logo{ height:14pt; display:block; }
</style>
</head>
<body>
<main class="page" data-piece="{{piece}}">
  <p class="eyebrow">{{eyebrow}}</p>
  <h1>{{title}}</h1>
  <div class="media">{{{image}}}</div>
  {{{sections}}}
  <div class="foot">
    <p class="cta">{{cta}}</p>
    {{{wordmark}}}
  </div>
</main>
</body>
</html>
