# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "supabase"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` is always included.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request. `public` is always included.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[api.tls]
enabled = false

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
# 17 = Supabase Cloud "Strata" (bkvcixdmuyejfzcijpdg); local dev rebuilds on PG17 at next `supabase start`.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory. For example:
# sql_paths = ['./seeds/*.sql', '../project-src/seeds/*-load-testing.sql']
sql_paths = ['./seed/00-legacy-grants.sql', './seed/dev-accounts.sql', './seed/organizations.sql', './seed/vendors.sql', './seed/products.sql', './seed/designer-clients.sql', './seed/leads_room_scans.sql', './seed/proposals.sql', './seed/proposal-captures.sql', './seed/decisions.sql', './seed/schedule.sql', './seed/schedule-extremes.sql', './seed/project_documents_tasks.sql', './seed/paint_colors_seed.sql', './seed/procurement_workspace_dev.sql', './seed/procurement_receiving_dev.sql', './seed/procurement_notifications_dev.sql', './seed/aesthete_demo.sql', './seed/agent-tasks-dev.sql', './seed/fulfillment-vendor-profiles.sql', './seed/fulfillment-catalog-dev.sql', './seed/99-local-edge-settings.sql']

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

# Uncomment to configure local storage buckets
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "http://127.0.0.1:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = ["https://127.0.0.1:3000", "http://localhost:3000/auth/callback", "field://auth/callback"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
minimum_password_length = 6
# Passwords that do not meet the following requirements will be rejected as weak. Supported values
# are: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
password_requirements = ""

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = false
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
secure_password_change = false
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
max_frequency = "1s"
# Number of characters used in the email OTP.
otp_length = 6
# Number of seconds before the email OTP expires (defaults to 1 hour).
otp_expiry = 3600

# Use a production-ready SMTP server
# [auth.email.smtp]
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# Branded auth email templates (Patina email design system).
# Prod (Strata) mirrors these via scripts/emails/deploy-auth-templates.ts —
# these files are the single source of truth for local and prod.
[auth.email.template.magic_link]
subject = "Sign in to Patina"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Confirm your Patina email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Patina password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new Patina email"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.invite]
subject = "You're invited to Patina"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your Patina verification code"
content_path = "./supabase/templates/reauthentication.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }}"
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure logged in session timeouts.
# [auth.sessions]
# Force log out after the specified duration.
# timebox = "24h"
# Force log out if the user has been inactive longer than the specified duration.
# inactivity_timeout = "8h"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
# Control how many MFA factors can be enrolled at once per user.
max_enrolled_factors = 10

# Control use of MFA via App Authenticator (TOTP)
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Configure Multi-factor-authentication via Phone Messaging
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure Multi-factor-authentication via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth redirectUrl.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false

# Use Firebase Auth as a third-party provider alongside Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 as a third-party provider alongside Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) as a third-party provider alongside Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

[edge_runtime]
enabled = true
# Configure one of the supported request policies: `oneshot`, `per_worker`.
# Use `oneshot` for hot reload, or `per_worker` for load testing.
policy = "oneshot"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083

# Use these configurations to customize your Edge Function.
# [functions.MY_FUNCTION_NAME]
# enabled = true
# verify_jwt = true
# import_map = "./functions/MY_FUNCTION_NAME/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
# entrypoint = "./functions/MY_FUNCTION_NAME/index.ts"

# Stripe calls this endpoint directly and can't carry a Supabase JWT.
# Authenticity is enforced inside the function via the Stripe signature
# (STRIPE_WEBHOOK_SECRET).
[functions.stripe-webhook]
verify_jwt = false

# External webhook — Resend signs with its own webhook secret, no Supabase JWT.
[functions.resend-webhook]
verify_jwt = false

# Twilio posts inbound SMS here directly and cannot carry a Supabase JWT.
# Authenticity is enforced inside the function via the X-Twilio-Signature
# (HMAC-SHA1 over SMS_INBOUND_PUBLIC_URL + params, keyed by TWILIO_AUTH_TOKEN).
[functions.sms-inbound]
verify_jwt = false

# Unauthenticated email-link GET (?t=<signed token>); its own token is the auth.
[functions.comms-mute]
verify_jwt = false

# Web→Field QR handoff (designer portal → Patina Field iOS). The gateway MUST
# verify the caller's JWT; the function then mints a magiclink token ONLY for
# the caller's own verified identity (never an arbitrary email). Explicit here
# for intent, though verify_jwt = true is the platform default.
[functions.field-login-token]
verify_jwt = true

# Admin-only branded designer invite. The gateway verifies the caller's JWT;
# the function then requires an admin-domain role in-code before minting an
# invite for an arbitrary email. Explicit here for intent, though
# verify_jwt = true is the platform default.
[functions.designer-invite]
verify_jwt = true

# Studio owner/admin invites a teammate by email. The platform MUST verify the
# caller's JWT; the function then requires an active owner/admin membership in
# the target organization before minting/inviting. Explicit for intent, though
# verify_jwt = true is the platform default.
[functions.workspace-member-invite]
verify_jwt = true

# Agent OS Morning Brief (WP-1.3, 00302). Invoked nightly via
# pg_cron -> invoke_edge_function (service-role bearer, same cron->edge
# bridge as decision-reminders/field-daily) and on-demand from the admin
# portal's Regenerate button via the caller's own session client. Neither
# caller path can skip Supabase's JWT check, and the function itself does not
# need to resolve caller identity — same shape as decision-reminders/
# field-daily, which also rely on the verify_jwt = true platform default and
# so carry no explicit stanza; this one is explicit for intent/discoverability.
[functions.morning-brief]
verify_jwt = true

# Cron-invoked every 30 min via public.invoke_edge_function (00303), which POSTs
# an apikey + service-role Bearer — so the platform JWT check passes. No browser
# calls it. verify_jwt = true is the platform default; explicit here for intent,
# matching the other cron-invoked functions.
[functions.cowork-intake-bridge]
verify_jwt = true

# Agent OS Stripe event processor (WP-2.1, 00304). Cron-invoked every 5 min via
# public.invoke_edge_function (00304), which POSTs an apikey + service-role
# Bearer — so the platform JWT check passes. No browser calls it; it re-fetches
# each Stripe object with STRIPE_SECRET_KEY and reconciles it against internal
# state. verify_jwt = true is the platform default; explicit here for intent,
# matching the other cron-invoked functions.
[functions.stripe-event-processor]
verify_jwt = true

# Agent OS Catalog Normalizer (WP-2.4, 00307). Invoked nightly via
# pg_cron -> invoke_edge_function (service-role bearer, same cron->edge
# bridge as cowork-intake-bridge/morning-brief) and claims queued
# normalize_feed agent_tasks the admin portal's feed-upload route enqueues.
# No browser calls it. verify_jwt = true is the platform default; explicit
# here for intent, matching the other cron-invoked functions.
[functions.catalog-normalizer]
verify_jwt = true

# Room View parser (Phase 1.1, 00337). Invoked as a SWEEP via
# pg_cron -> invoke_edge_function (service-role bearer, same cron->edge bridge
# as catalog-normalizer/morning-brief; the schedule is authored in 00338), and
# for TARGETED re-parses by a server-to-server service-role call. No browser
# calls it — and the function additionally decodes the JWT and requires
# role == 'service_role' in-code before touching storage. verify_jwt = true is
# the platform default; explicit here for intent, matching the other
# cron-invoked functions.
[functions.parse-room-scan]
verify_jwt = true

# Room View USDZ→GLB archival lane (R107, 00338). Cron-invoked every 15 min via
# pg_cron -> invoke_edge_function (service-role Bearer, same cron->edge bridge as
# the other Agent OS crons) and also callable with { scanId, force? }. It drives
# aesthete-inference /convert/usdz-to-glb and stamps room_scans.model_url_gltf.
# No browser calls it; the function additionally requires a service_role claim
# in-code. verify_jwt = true is the platform default; explicit here for intent,
# matching the other cron-invoked functions.
[functions.convert-room-scan-glb]
verify_jwt = true

# BOH fulfillment intake worker (S0, 00354). Cron-invoked every minute via
# pg_cron -> invoke_edge_function (service-role Bearer, same cron->edge bridge
# as the other Agent OS crons); also callable directly with { seed_pi, actor? }
# for local dev seeding (scripts/seed-fulfillment-orders.ts, task C2). No
# browser calls it. verify_jwt = true is the platform default; explicit here
# for intent, matching the other cron-invoked functions.
[functions.fulfillment-intake]
verify_jwt = true

# BOH fulfillment events → PostHog mirror (S0, 00354). Cron-invoked every 5 min
# via pg_cron -> invoke_edge_function (service-role Bearer, same cron->edge
# bridge as the other Agent OS crons). No browser calls it. verify_jwt = true
# is the platform default; explicit here for intent, matching the other
# cron-invoked functions.
[functions.fulfillment-events-mirror]
verify_jwt = true

# BOH client-notification dispatcher (S4, spec §6). Service-role-invoked ONLY —
# apps/admin-portal's notifications/{draft,[id]/send} routes call it via
# adminClient.functions.invoke(...), which sends the service-role key as the
# bearer. No browser calls it directly. verify_jwt = true is the platform
# default; explicit here for intent, matching the other service-role-invoked
# BOH functions (fulfillment-intake, apns-send).
[functions.fulfillment-notify]
verify_jwt = true

# BOH derived-status API for iOS (S4, spec §6/§9.5). Caller-JWT-invoked — the
# opposite posture from every other BOH function: the iOS client calls this
# directly with ITS OWN user JWT (never service-role), which the function then
# forwards to PostgREST so client_order_status_v's own-row auth.uid() scope
# does the filtering (see confirm-scan-bundle for the same JWT-forwarding
# pattern). verify_jwt = true is the platform default; explicit here because
# the auth posture is the whole point of this function, not incidental.
[functions.fulfillment-status]
verify_jwt = true

# Room View HEIC→JPEG derivative lane (I78, 00340). Cron-invoked every 5 min via
# pg_cron -> invoke_edge_function (service-role Bearer, same cron->edge bridge as
# the other Room View sweeps) and also callable with { scanId | imageId, force? }.
# It drives aesthete-inference /convert/heic-to-jpeg and stamps room_scan_images
# thumbnail_url + preview_url. No browser calls it; the function additionally
# requires a service_role claim in-code. verify_jwt = true is the platform
# default; explicit here for intent, matching the other cron-invoked functions.
[functions.derive-scan-photo-media]
verify_jwt = true

# BOH PO Composer render/transmit worker (S3, spec §5.3). Server-to-server only:
# the admin-portal composer routes call it with a service-role Bearer. verify_jwt
# = false so the gateway does NOT verify (sidesteps the local status-vs-vault
# HS256/ES256 key mismatch documented in the room-scans fixtures README); the
# function REQUIRES role == 'service_role' in-code (parse-room-scan idiom). No
# browser calls it directly.
[functions.fulfillment-po]
verify_jwt = false

# BOH client evidence-upload flow (S7). Public, token-gated in-code: the
# client-portal /evidence/[token] page calls this directly with the anon key
# (no session — the 64-hex-char token minted by fulfillment_mint_evidence_token
# IS the authority, checked inside fulfillment_evidence_token_context /
# fulfillment_append_evidence, both SECURITY DEFINER + service_role-only,
# 00364). verify_jwt = false so the gateway does not demand a caller JWT; CORS
# is wired in-code the same way create-checkout-session/fulfillment-po do.
[functions.fulfillment-evidence]
verify_jwt = false

# BOH daily Stripe balance-transaction reconciliation (S6, R2.3, spec §8).
# Cron-invoked once a day via pg_cron -> invoke_edge_function (00362,
# service-role Bearer) — pulls balance transactions since the cursor into the
# append-only stripe_balance_transactions mirror; ledger_stripe_recon_v then
# reconciles account 1000 and fulfillment_queue_v pins deltas. Also callable
# with { fixture_transactions: [...] } for the local test/assert path (no live
# key). With STRIPE_SECRET_KEY unset it skips gracefully. No browser calls it.
# verify_jwt = true is the platform default; explicit here for intent.
[functions.fulfillment-stripe-recon]
verify_jwt = true

# Zero-install Site Request fulfillment. The request-scoped opaque Bearer token
# is the credential; the function validates its shape, SHA-256 hashes it, and
# uses only service-role RPCs that accept the hash. It never returns a JWT,
# service key, or direct table access. Browser CORS is enforced in-code.
[functions.site-request-guest]
verify_jwt = false

# Authenticated Site Request SMS boundary. Designer send/resend/nudge retains
# the caller JWT for RPC authorization; the consent-granted bridge additionally
# requires a service_role claim in-code before minting or dispatching a link.
[functions.site-request-dispatch]
verify_jwt = true

# Service-only Site Request media worker. Cron invokes it every five minutes to
# create deterministic JPEG derivatives through the existing Cloudflare
# inference rail and purge only unapproved evidence past its 90-day deadline.
[functions.site-request-media-maintenance]
verify_jwt = true

# Shared APNs provider boundary. Only service-role server/cron callers may
# select a user or token and supply notification copy; the function enforces
# the service-role claim again in-code before reading the request body.
[functions.apns-send]
verify_jwt = true

[analytics]
enabled = true
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"
